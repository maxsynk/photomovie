PHOTO MOVIE - MODO TELÃO
VERSÃO: 2.0.0
BASEADO NO SISTEMA ANTIGO v1.9
ADAPTADO PARA PHOTO MOVIE
-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TELÃO - Photo Movie</title>
    <style>
        body {
            margin: 0;
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            cursor: none;
        }

        .slide-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 1;
            background: #000;
        }

        .active {
            opacity: 1;
            z-index: 10;
        }

        .main-media {
            max-width: 98%;
            max-height: 100%;
            object-fit: contain;
            z-index: 5;
            box-shadow: 0 0 50px #000;
            border-radius: 12px;
        }

        /* Controles */
        #controls-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 50px;
            padding: 15px 25px;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
        }

        #controls-bar.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(100px);
            pointer-events: none;
        }

        .control-btn {
            background: rgba(197, 160, 89, 0.2);
            border: 1px solid #c5a059;
            color: #c5a059;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .control-btn:hover {
            background: #c5a059;
            color: #000;
            transform: scale(1.1);
        }

        #video-counter {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* Loading */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(197, 160, 89, 0.1);
            border-top: 3px solid #c5a059;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #c5a059;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando Telão...</div>
    </div>

    <!-- Containers de slide (baseado no sistema antigo) -->
    <div id="c1" class="slide-container"></div>
    <div id="c2" class="slide-container"></div>

    <!-- Controles -->
    <div id="controls-bar">
        <button class="control-btn" onclick="videoAnterior()">⏮</button>
        <button class="control-btn" onclick="toggleSom()" id="btn-sound">🔊</button>
        <button class="control-btn" onclick="proximoVideo()">⏭</button>
        <span id="video-counter">0/0</span>
    </div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
    
    let videos = [];
    let videoAtual = 0;
    let toggle = true;
    let comSom = true;
    let timeoutControles;
    let eventoAtivo = null;

    // Inicialização
    window.onload = async () => {
        try {
            await carregarEventoAtivo();
            await carregarVideos();
            
            if (videos.length > 0) {
                setTimeout(() => {
                    document.getElementById('loading-screen').classList.add('hidden');
                }, 500);
                
                proximoVideo();
                
                setTimeout(() => {
                    tentarFullscreen();
                }, 1000);
            } else {
                mostrarErro("Nenhum vídeo encontrado");
            }
        } catch (error) {
            console.error("Erro:", error);
            mostrarErro("Erro ao carregar vídeos");
        }
        
        // Eventos
        document.addEventListener('mousemove', mostrarControles);
        document.addEventListener('touchstart', mostrarControles);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') proximoVideo();
            if (e.key === 'ArrowLeft') videoAnterior();
            if (e.key === ' ') { e.preventDefault(); toggleSom(); }
            if (e.key === 'Escape') sairFullscreen();
        });
    };

    // Carregar evento ativo
    async function carregarEventoAtivo() {
        const config = JSON.parse(localStorage.getItem('config_atual'));
        
        if (config && config.id) {
            eventoAtivo = config;
            return;
        }
        
        // Tentar da URL
        const urlParams = new URLSearchParams(window.location.search);
        const eventoUrl = urlParams.get('evento');
        if (eventoUrl) {
            eventoAtivo = { id: eventoUrl, nome: eventoUrl };
            return;
        }
        
        // Buscar primeiro evento
        try {
            const res = await fetch(`${WORKER_URL}/listar-eventos?t=${Date.now()}`);
            const eventos = await res.json();
            if (eventos && eventos.length > 0) {
                eventoAtivo = eventos[0];
            } else {
                throw new Error("Nenhum evento encontrado");
            }
        } catch (error) {
            throw error;
        }
    }

    // Carregar lista de vídeos
    async function carregarVideos() {
        if (!eventoAtivo || !eventoAtivo.id) {
            throw new Error("Evento não definido");
        }
        
        const url = `${WORKER_URL}/listar-galeria?evento=${encodeURIComponent(eventoAtivo.id)}&t=${Date.now()}`;
        const res = await fetch(url);
        const dados = await res.json();
        
        // Filtrar apenas vídeos finais
        videos = dados
            .filter(f => {
                const path = f.path || "";
                const filename = path.split('/').pop();
                return filename.startsWith('final_') && filename.endsWith('.mp4');
            })
            .sort((a, b) => new Date(a.uploaded || 0) - new Date(b.uploaded || 0))
            .map(f => ({
                path: f.path,
                url: `${WORKER_URL}/stream?id=${encodeURIComponent(f.path)}`
            }));
    }

    // Próximo vídeo (baseado no sistema antigo)
    function proximoVideo() {
        if (!videos.length) {
            setTimeout(proximoVideo, 3000);
            return;
        }
        
        const item = videos[videoAtual];
        const nIn = toggle ? document.getElementById('c1') : document.getElementById('c2');
        const nOut = toggle ? document.getElementById('c2') : document.getElementById('c1');
        
        // Criar elemento de vídeo
        const el = document.createElement('video');
        el.src = item.url;
        el.className = 'main-media';
        el.muted = !comSom;
        el.autoplay = true;
        el.playsinline = true;
        el.onended = () => {
            videoAtual = (videoAtual + 1) % videos.length;
            proximoVideo();
        };
        el.onerror = () => {
            videoAtual = (videoAtual + 1) % videos.length;
            proximoVideo();
        };
        
        nIn.innerHTML = '';
        nIn.appendChild(el);
        el.load();
        
        setTimeout(() => {
            nIn.classList.add('active');
            nOut.classList.remove('active');
            toggle = !toggle;
            atualizarContador();
        }, 200);
        
        videoAtual = (videoAtual + 1) % videos.length;
        mostrarControles();
    }

    // Vídeo anterior
    function videoAnterior() {
        videoAtual = (videoAtual - 2 + videos.length) % videos.length;
        if (videoAtual < 0) videoAtual = 0;
        proximoVideo();
        mostrarControles();
    }

    // Toggle som
    function toggleSom() {
        comSom = !comSom;
        const btnSom = document.getElementById('btn-sound');
        btnSom.textContent = comSom ? '🔊' : '🔇';
        
        // Atualizar vídeo atual
        const videosAtivos = document.querySelectorAll('video');
        videosAtivos.forEach(v => {
            v.muted = !comSom;
        });
        
        mostrarControles();
    }

    // Atualizar contador
    function atualizarContador() {
        const contador = document.getElementById('video-counter');
        contador.textContent = `${(videoAtual - 1 + videos.length) % videos.length + 1}/${videos.length}`;
    }

    // Mostrar controles
    function mostrarControles() {
        const controls = document.getElementById('controls-bar');
        controls.classList.remove('hidden');
        
        clearTimeout(timeoutControles);
        timeoutControles = setTimeout(() => {
            controls.classList.add('hidden');
        }, 3000);
    }

    // Fullscreen
    function tentarFullscreen() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
            elem.requestFullscreen().catch(() => {});
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        }
    }

    function sairFullscreen() {
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
        }
    }

    // Mostrar erro
    function mostrarErro(mensagem) {
        document.getElementById('loading-screen').innerHTML = `
            <div style="color: #ff4d4d; font-size: 24px; margin-bottom: 20px;">❌</div>
            <div class="loading-text">${mensagem}</div>
            <button onclick="voltarParaIndex()" style="
                margin-top: 30px;
                padding: 15px 30px;
                background: #c5a059;
                color: #000;
                border: none;
                border-radius: 10px;
                font-weight: bold;
                cursor: pointer;
                font-size: 16px;
            ">VOLTAR</button>
        `;
    }

    function voltarParaIndex() {
        window.location.href = 'index.html';
    }

    // Prevenir contexto menu
    document.addEventListener('contextmenu', (e) => e.preventDefault());
</script>
</body>
</html>

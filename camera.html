<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Pro - Photo Movie v1.0</title>
    <style>
        :root { --turquesa: #00d1d1; --dourado: #c5a059; --preto: #000; --vermelho: #ff3b30; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #cam-container { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #moldura-view { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; object-fit: fill; z-index: 10; display: none; }
        .event-overlay { position: absolute; top: 30px; width: 100%; text-align: center; z-index: 20; color: var(--dourado); text-transform: uppercase; letter-spacing: 3px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        #rec-indicator { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 25; background: rgba(0,0,0,0.6); color: #fff; padding: 6px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; display: none; align-items: center; gap: 8px; border: 1px solid var(--vermelho); }
        .dot { width: 10px; height: 10px; background-color: var(--vermelho); border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .controls-wrapper { position: absolute; bottom: 80px; width: 100%; display: flex; align-items: center; justify-content: space-around; z-index: 100; }
        .side-btn { background: rgba(0,0,0,0.5); border: 1px solid var(--dourado); color: var(--dourado); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; backdrop-filter: blur(5px); }
        .shutter-container { position: relative; }
        .shutter { width: 75px; height: 75px; border-radius: 50%; background: transparent; border: 4px solid var(--dourado); cursor: pointer; transition: transform 0.2s; }
        .shutter:active { transform: scale(0.9); }
        #status { position: fixed; inset: 0; display: none; background: rgba(0,0,0,0.7); color: var(--dourado); font-size: 120px; align-items: center; justify-content: center; z-index: 200; font-weight: 900; }
        #loading { position: fixed; inset: 0; display: none; background: #000; color: var(--turquesa); align-items: center; justify-content: center; z-index: 300; flex-direction: column; gap: 15px; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--turquesa); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="cam-container">
        <div class="event-overlay" id="txt-evento">CARREGANDO...</div>
        <div id="rec-indicator"><div class="dot"></div>GRAVANDO</div>
        <video id="preview" autoplay playsinline muted></video>
        <img id="moldura-view" alt="moldura">
        <div class="controls-wrapper">
            <div class="side-btn" onclick="window.location.href='index.html'">✕</div>
            <div class="shutter-container"><div class="shutter" id="btn-shoot"></div></div>
            <div class="side-btn" onclick="toggleCamera()">🔄</div>
        </div>
    </div>
    <canvas id="canvas" width="720" height="1280" style="display:none;"></canvas>
    <div id="status"></div>
    <div id="loading"><div class="spinner"></div><b>PROCESSANDO E ENVIANDO...</b></div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
    const video = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('btn-shoot');
    const view = document.getElementById('moldura-view');
    const txtEvento = document.getElementById('txt-evento');
    const recIndicator = document.getElementById('rec-indicator');
    
    let currentStream;
    let useFrontCamera = false;
    let gravandoAtiva = false;
    let configAtual = null;
    let molduraImg = new Image();
    
    async function startCamera() {
        if (currentStream) currentStream.getTracks().forEach(track => track.stop());
        const constraints = { video: { facingMode: useFrontCamera ? "user" : "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
        } catch (e) { alert("Erro ao acessar câmera: " + e.message); }
    }
    
    function toggleCamera() { useFrontCamera = !useFrontCamera; startCamera(); }
    
    window.onload = async () => {
        configAtual = JSON.parse(localStorage.getItem('config_atual'));
        if (!configAtual) {
            alert("Nenhum evento selecionado! Volte e selecione um evento.");
            window.location.href = 'index.html';
            return;
        }
        
        txtEvento.innerText = configAtual.nome || "PHOTO MOVIE";
        
        if (configAtual.molduraUrl) {
            const urlFinal = `${WORKER_URL}/stream?id=${configAtual.molduraUrl}`;
            molduraImg.src = urlFinal;
            view.src = urlFinal;
            molduraImg.onload = () => view.style.display = 'block';
        }
        
        await startCamera();
    };
    
    btn.onclick = () => {
        let c = 3;
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'flex';
        statusDiv.innerText = c;
        let t = setInterval(() => {
            c--;
            if(c > 0) statusDiv.innerText = c;
            else { clearInterval(t); statusDiv.style.display = 'none'; iniciarGravacao(); }
        }, 1000);
    };
    
    function iniciarGravacao() {
        const chunks = [];
        const tempo = (configAtual && configAtual.tempo ? parseInt(configAtual.tempo) : 10) * 1000;
        const nomeEvento = configAtual.nome || configAtual.id || "DEMONSTRACAO";
        
        console.log("🎬 Iniciando gravação para:", nomeEvento);
        console.log("⏱️ Duração:", tempo/1000, "s");
        
        recIndicator.style.display = 'flex';
        gravandoAtiva = true;
        
        const loop = () => {
            if (video.paused || video.ended || !gravandoAtiva) return;
            ctx.save();
            if(useFrontCamera) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
            if (molduraImg.complete && molduraImg.src) { ctx.drawImage(molduraImg, 0, 0, canvas.width, canvas.height); }
            requestAnimationFrame(loop);
        };
        
        const stream = canvas.captureStream(30);
        let options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 3000000 };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm' }; }
        
        const recorder = new MediaRecorder(stream, options);
        recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
        
        recorder.onstop = async () => {
            recIndicator.style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
            const blob = new Blob(chunks, { type: 'video/webm' });
            
            console.log("📦 Tamanho do vídeo:", blob.size, "bytes");
            
            const fd = new FormData();
            const videoNome = "vid_" + Date.now() + ".webm";
            fd.append("file", blob, videoNome);
            fd.append("uuid", videoNome);
            fd.append("evento", nomeEvento);
            
            try {
                const res = await fetch(`${WORKER_URL}/upload`, { method: "POST", body: fd });
                console.log("📡 Upload resposta:", res.status);
                
                if(res.ok) {
                    alert("✅ Vídeo enviado com sucesso!");
                    setTimeout(() => { window.location.href = "galeria.html"; }, 800);
                } else {
                    const erro = await res.text();
                    alert("❌ Erro: " + erro);
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (err) {
                alert("❌ Falha de rede: " + err.message);
                document.getElementById('loading').style.display = 'none';
            }
        };
        
        recorder.start();
        loop();
        setTimeout(() => { gravandoAtiva = false; if(recorder.state === "recording") recorder.stop(); }, tempo);
    }
</script>
</body>
</html>

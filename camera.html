<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Pro - PHOTO MOVIE</title>
    <style>
        :root { --turquesa: #00d1d1; --dourado: #c5a059; --preto: #000; --vermelho: #ff3b30; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #cam-container { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        #moldura-view { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            pointer-events: none; object-fit: fill; z-index: 10; 
            display: none; 
        }

        .event-overlay {
            position: absolute; top: 30px; width: 100%; text-align: center;
            z-index: 20; color: var(--dourado); text-transform: uppercase;
            letter-spacing: 3px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #rec-indicator {
            position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
            z-index: 25; background: rgba(0, 0, 0, 0.6); color: #fff;
            padding: 6px 15px; border-radius: 20px; font-weight: bold;
            font-size: 14px; display: none; align-items: center; gap: 8px;
            border: 1px solid var(--vermelho); letter-spacing: 1px;
        }
        .dot {
            width: 10px; height: 10px; background-color: var(--vermelho);
            border-radius: 50%; animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; } 50% { opacity: 0; }
        }

        .controls-wrapper {
            position: absolute; bottom: 80px; width: 100%;
            display: flex; align-items: center; justify-content: space-around;
            z-index: 100;
        }

        .side-btn {
            background: rgba(0,0,0,0.5); border: 1px solid var(--dourado);
            color: var(--dourado); width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 20px; backdrop-filter: blur(5px);
        }

        .shutter-container { position: relative; display: flex; align-items: center; justify-content: center; }
        .shutter { 
            width: 75px; height: 75px; border-radius: 50%; 
            background: transparent; border: 4px solid var(--dourado); 
            cursor: pointer; position: relative; z-index: 105;
            transition: transform 0.2s;
        }
        .shutter:active { transform: scale(0.9); }

        .shutter::after {
            content: ''; position: absolute; inset: -10px;
            border-radius: 50%; border: 2px solid var(--dourado);
            animation: pulse-gold 1.5s infinite; opacity: 0;
        }

        @keyframes pulse-gold {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        #status { position: fixed; inset: 0; display: none; background: rgba(0,0,0,0.4); color: var(--dourado); font-size: 120px; align-items: center; justify-content: center; z-index: 200; font-weight: 900; }
        
        #loading { 
            position: fixed; inset: 0; display: none; background: #000; color: var(--turquesa); 
            align-items: center; justify-content: center; z-index: 300; flex-direction: column; gap: 15px; 
        }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--turquesa); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="cam-container">
        <div class="event-overlay" id="txt-evento">PHOTO MOVIE</div>
        
        <div id="rec-indicator"><div class="dot"></div>GRAVANDO</div>
        
        <!-- CORREÇÃO: REMOVIDO O "muted". Adicionado "volume" e "playsinline" para funcionar no celular -->
        <video id="preview" autoplay playsinline volume="0"></video>
        <img id="moldura-view" alt="moldura">

        <div class="controls-wrapper">
            <div class="side-btn" onclick="window.location.href='index.html'">✕</div>
            
            <div class="shutter-container">
                <div class="shutter" id="btn-shoot"></div>
            </div>

            <div class="side-btn" onclick="toggleCamera()">🔄</div>
        </div>
    </div>

    <canvas id="canvas" width="720" height="1280" style="position: absolute; left: -9999px; visibility: hidden;"></canvas>
    <div id="status"></div>
    <div id="loading">
        <div class="spinner"></div>
        <b style="letter-spacing: 2px;">PROCESSANDO E ENVIANDO...</b>
    </div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
    const video = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('btn-shoot');
    const view = document.getElementById('moldura-view');
    const txtEvento = document.getElementById('txt-evento');
    const recIndicator = document.getElementById('rec-indicator');
    
    let currentStream;
    let useFrontCamera = false;
    let animationId = null; // Guarda o ID do loop para podermos para-lo depois
    const molduraImg = new Image();
    molduraImg.crossOrigin = "anonymous"; 

    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        const constraints = {
            video: { 
                facingMode: useFrontCamera ? "user" : "environment", 
                width: { ideal: 1280 }, height: { ideal: 720 } 
            },
            // CORREÇÃO: Habilita áudio na captura
            audio: true 
        };
        try {
            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;
        } catch (e) { alert("Erro ao acessar câmera."); }
    }

    function toggleCamera() {
        useFrontCamera = !useFrontCamera;
        startCamera();
    }

    window.onload = async () => {
        const config = JSON.parse(localStorage.getItem('config_atual'));
        if (config) {
            txtEvento.innerText = config.nome || "PHOTO MOVIE";
            let molduraPath = config.molduraUrl || config.moldura;
            if (molduraPath) {
                const cleanId = molduraPath.includes('id=') ? molduraPath.split('id=')[1] : molduraPath;
                const urlFinal = `${WORKER_URL}/stream?id=${cleanId}`;
                molduraImg.src = urlFinal;
                view.src = urlFinal;
                molduraImg.onload = () => view.style.display = 'block';
            }
        }
        startCamera();
    };

    btn.onclick = () => {
        let c = 3;
        const status = document.getElementById('status');
        status.style.display = 'flex';
        status.innerText = c;
        
        let t = setInterval(() => {
            c--;
            if(c > 0) status.innerText = c;
            else { 
                clearInterval(t); 
                status.style.display = 'none'; 
                iniciarGravacao(); 
            }
        }, 1000);
    };

    // CORREÇÃO 2: Função refatorada com loop infinito
    function iniciarGravacao() {
        const chunks = [];
        const config = JSON.parse(localStorage.getItem('config_atual'));
        const tempo = (config ? parseInt(config.tempo) : 10) * 1000;
        const nomeEvento = config ? (config.id_fixo || config.nome) : "Geral";

        recIndicator.style.display = 'flex';

        // Loop de desenho PERMANENTE. Ele só para quando fechamos a página.
        // O segredo do vídeo completo é ele nunca parar de desenhar!
        function desenharLoop() {
            if (!video.paused && !video.ended) {
                ctx.save();
                if(useFrontCamera) {
                    ctx.translate(canvas.width, 0);
                    ctx.scale(-1, 1);
                }
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                if (molduraImg.complete) {
                    ctx.drawImage(molduraImg, 0, 0, canvas.width, canvas.height);
                }
            }
            // AQUI ESTÁ O SEGREDO: O loop NUNCA trava! Ele chama a si mesmo eternamente.
            animationId = requestAnimationFrame(desenharLoop);
        };
        
        // Inicia o loop de desenho (corrigindo o erro fatal)
        desenharLoop(); 

        // --- Criando a Stream com ÁUDIO ---
        const videoStream = canvas.captureStream(30);
        
        // CORREÇÃO 3: Pega o áudio "real" da câmera e mescla com o vídeo do canvas
        const audioTracks = currentStream.getAudioTracks();
        let finalStream = videoStream;
        if (audioTracks.length > 0) {
            const audioStream = new MediaStream(audioTracks);
            // Cria uma stream mista (Vídeo do canvas + Áudio da câmera)
            finalStream = new MediaStream([
                ...videoStream.getVideoTracks(),
                ...audioStream.getAudioTracks()
            ]);
        }
        
        let options = { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 3000000 };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm' };
        }
        
        const recorder = new MediaRecorder(finalStream, options);
        
        recorder.ondataavailable = e => { 
            if(e.data && e.data.size > 0) chunks.push(e.data); 
        };
        
        recorder.onstop = async () => {
            recIndicator.style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
            
            // Para o loop de desenho apenas após o upload, para não gastar processamento inutilmente
            if (animationId) cancelAnimationFrame(animationId);
            
            const blob = new Blob(chunks, { type: 'video/webm' });
            
            // Se o blob estiver estranho, cancela
            if (blob.size < 10000) {
                alert("Erro: Vídeo de 0 segundos gerado. Verifique permissões de áudio.");
                document.getElementById('loading').style.display = 'none';
                return;
            }

            const fd = new FormData();
            fd.append("file", blob, "vid_" + Date.now() + ".webm");
            fd.append("uuid", "vid_" + Date.now() + ".webm");
            fd.append("evento", nomeEvento); 

            try {
                const res = await fetch(`${WORKER_URL}/upload`, { method: "POST", body: fd });
                if(res.ok) {
                    setTimeout(() => { window.location.href = "galeria.html"; }, 800);
                } else {
                    alert("Erro no envio do arquivo para o servidor.");
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (err) {
                alert("Falha de rede ao enviar.");
                document.getElementById('loading').style.display = 'none';
            }
        };

        recorder.start(200); 
        
        setTimeout(() => { 
            if(recorder.state === "recording") recorder.stop(); 
        }, tempo);
    }
</script>
</body>
</html>

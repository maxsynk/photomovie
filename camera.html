<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PHOTO MOVIE - Câmera v1.3</title>
    <style>
        :root { --bg: #050505; --dourado: #FFD000; --vermelho-neon: #ff0033; }
        
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            overflow: hidden; 
            color: white; 
            font-family: 'Segoe UI', sans-serif;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
        }
        
        #app { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            height: 100dvh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden;
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            background: #000;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: center center;
        }
        
        #moldura-overlay { 
            position: absolute; 
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 5; 
            display: none; 
            object-fit: fill;
        }
        
        #timer-display { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px; 
            font-weight: 900; 
            display: none; 
            color: var(--vermelho-neon);
            text-shadow: 0 0 30px rgba(255, 0, 51, 0.9), 0 0 60px rgba(255, 0, 51, 0.7);
            z-index: 15;
            pointer-events: none;
        }

        #warning-flash {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 15px solid var(--vermelho-neon);
            box-shadow: inset 0 0 30px var(--vermelho-neon), 0 0 30px var(--vermelho-neon);
            pointer-events: none;
            z-index: 6;
            animation: piscar 0.3s infinite alternate;
        }
        @keyframes piscar {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .btn-top {
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            border: 2px solid var(--dourado);
            background: rgba(0,0,0,0.5); 
            color: var(--dourado); 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            font-size: 18px; 
            backdrop-filter: blur(5px);
            pointer-events: auto;
            touch-action: manipulation;
        }
        .btn-top.muted { color: var(--vermelho-neon); border-color: var(--vermelho-neon); }
        
        .controls { 
            position: absolute; 
            bottom: 30px;
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            z-index: 10;
            pointer-events: auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        
        .btn { 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            border: 2px solid var(--dourado); 
            background: rgba(0,0,0,0.7); 
            color: var(--dourado); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 20px; 
            backdrop-filter: blur(5px);
            pointer-events: auto;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        
        .shutter { 
            width: 80px; 
            height: 80px; 
            border: 4px solid var(--dourado); 
            touch-action: manipulation;
            cursor: pointer;
        }
        .shutter:active { transform: scale(0.9); }
        
        #loader { 
            position: fixed; 
            inset: 0; 
            z-index: 100; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            background: rgba(0, 0, 0, 0.85); 
            flex-direction: column; 
            color: var(--dourado);
        }
        
        .spin { 
            width: 50px; 
            height: 50px; 
            border: 5px solid rgba(255,255,255,0.1); 
            border-top-color: var(--dourado); 
            border-radius: 50%; 
            animation: rotate 1s linear infinite; 
        }
        
        @keyframes rotate { to { transform: rotate(360deg); } }
        
        html, body {
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #version-info {
            position: absolute;
            bottom: 5px;
            right: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
            z-index: 25;
            pointer-events: none;
        }
    </style>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Movie">
<link rel="stylesheet" href="app.css">
<script src="pwa.js" defer></script>
</head>
<body>
    <div id="app">
        <!-- Timer centralizado -->
        <div id="timer-display">3</div>

        <!-- Moldura fullscreen -->
        <img id="moldura-overlay" alt="Moldura do Evento">
        
        <div id="warning-flash"></div>
        <div id="fila-badge"></div>

        <!-- Controles superiores -->
        <div class="top-controls">
            <div class="btn-top muted" id="btn-mic">🔇</div>
        </div>

        <video id="preview" autoplay playsinline></video>
        
        <!-- Botões de controle -->
        <div class="controls">
            <div class="btn" id="btn-close">✕</div>
            <div class="btn shutter" id="rec-btn"></div>
            <div class="btn" id="btn-switch">🔄</div>
        </div>
        
        <!-- Versão da câmera -->
        <div id="version-info">v1.3</div>
    </div>
    
    <canvas id="canvas" style="position: absolute; left: -9999px; visibility: hidden;"></canvas>

    <div id="loader">
        <div class="spin"></div>
        <p id="loader-text" style="margin-top:20px; letter-spacing: 2px;">ENVIANDO VÍDEO...</p>
    </div>

<script>
    const CAMERA_VERSION = "v1.3";
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev"; 
    
    const video = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const warningFlash = document.getElementById('warning-flash');
    const recBtn = document.getElementById('rec-btn');
    
    const molduraImg = new Image();
    let stream, recorder, chunks = [];
    let isFrontCamera = false, isRecording = false;
    let isMicActive = false;
    let animationId = null;
    let countdownTimer = null, semEvento = false, audioCtx = null;

    // Função para iniciar gravação
    function startRecordingProcess() {
        if (semEvento) { alert("Nenhum evento ativo. Ative um evento na Central."); return; }
        if (isRecording) {
            if (countdownTimer) {
                clearInterval(countdownTimer); countdownTimer = null; isRecording = false;
                recBtn.style.opacity = "1"; document.getElementById('timer-display').style.display = 'none';
            }
            return;
        }
        isRecording = true; bip(660); if (navigator.vibrate) navigator.vibrate(40);
        recBtn.style.opacity = "0.2";
        let count = 3;
        const timer = document.getElementById('timer-display');
        timer.style.display = 'block';
        timer.innerText = count;
        timer.style.color = '#ff0033';
        
        let countdown = countdownTimer = setInterval(() => {
            count--;
            if (count > 0) { bip(660);
                timer.innerText = count;
                timer.style.color = '#ff0033';
            } else { 
                clearInterval(countdown); countdownTimer = null; bip(990, 350); if (navigator.vibrate) navigator.vibrate([80, 40, 80]); 
                timer.style.display = 'none';
                startRecording(); 
            }
        }, 1000);
    }

    async function initCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: isFrontCamera ? "user" : "environment", 
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: isMicActive
            });
            video.srcObject = stream;
            
            // Aplica espelhamento apenas para câmera frontal
            if (isFrontCamera) {
                video.style.transform = 'scaleX(-1)';
            } else {
                video.style.transform = 'none';
            }
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            };
        } catch (err) {
            if (!(err.name === 'NotAllowedError' && isMicActive)) mostrarErroCamera(err);
            if(err.name === 'NotAllowedError' && isMicActive) {
                alert("Permissão de microfone negada.");
                isMicActive = false;
                document.getElementById('btn-mic').classList.add('muted');
                document.getElementById('btn-mic').innerText = "🔇";
            }
        }
    }

    async function toggleMicrofone() {
        if (isRecording) return;
        isMicActive = !isMicActive;
        const micBtn = document.getElementById('btn-mic');
        
        if (isMicActive) {
            micBtn.classList.remove('muted');
            micBtn.innerText = "🎤";
        } else {
            micBtn.classList.add('muted');
            micBtn.innerText = "🔇";
        }
        await initCamera();
    }

    function switchCamera() { 
        if (!isRecording) { 
            isFrontCamera = !isFrontCamera; 
            initCamera(); 
        } 
    }
    
    function closeCamera() {
        if (isRecording && !confirm('Gravação em andamento. Sair e perder este vídeo?')) return;
        if (stream) stream.getTracks().forEach(t => t.stop());
        window.location.href = 'index.html';
    }

    // Adicionar event listeners
    function setupEventListeners() {
        // Botão de gravação (obturador)
        recBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            startRecordingProcess();
        });
        
        recBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            e.stopPropagation();
            startRecordingProcess();
        });
        
        // Botão de fechar
        const closeBtn = document.getElementById('btn-close');
        closeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            closeCamera();
        });
        
        closeBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            e.stopPropagation();
            closeCamera();
        });
        
        // Botão de trocar câmera
        const switchBtn = document.getElementById('btn-switch');
        switchBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            switchCamera();
        });
        
        switchBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            e.stopPropagation();
            switchCamera();
        });
        
        // Botão de microfone
        const micBtn = document.getElementById('btn-mic');
        micBtn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleMicrofone();
        });
        
        micBtn.addEventListener('touchend', function(e) {
            e.preventDefault();
            e.stopPropagation();
            toggleMicrofone();
        });
    }

    window.onload = () => {
        // Configurar event listeners
        setupEventListeners();
        
        // Bloquear gestos de navegação
        document.addEventListener('touchmove', function(e) {
            // Verificar se o toque começou em um botão
            if (e.target.closest('.btn') || e.target.closest('.btn-top')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });
        
        // Prevenir pinch-zoom
        document.addEventListener('gesturestart', function(e) {
            e.preventDefault();
        });
        
        // Prevenir double-tap zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
        
        // Impedir menu de contexto
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
        
        const config = JSON.parse(localStorage.getItem('config_atual'));
        if (config) {
            let path = config.molduraUrl || config.moldura;
            if (path) {
                const cleanId = path.includes('id=') ? path.split('id=')[1] : path;
                const url = path.startsWith('http') ? path : `${WORKER_URL}/stream?id=${cleanId}`;
                
                molduraImg.src = url;
                const overlayElem = document.getElementById('moldura-overlay');
                overlayElem.src = url;
                
                molduraImg.onload = () => {
                    overlayElem.style.display = 'block';
                };
            }
        }
        if (!config) { semEvento = true; alert("Nenhum evento ativo. Volte à Central e ative um evento."); recBtn.style.opacity = "0.3"; }
        manterTelaLigada();
        document.addEventListener('visibilitychange', () => { if (!document.hidden) manterTelaLigada(); });
        window.addEventListener('online', processarFila);
        window.addEventListener('pagehide', () => { if (stream) stream.getTracks().forEach(t => t.stop()); });
        atualizarFila(); processarFila();
        initCamera();
    };

    function bip(freq, ms) {
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.frequency.value = freq; g.gain.value = 0.08; o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + (ms || 120) / 1000);
        } catch (e) {}
    }
    async function manterTelaLigada() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
    function mostrarErroCamera(err) {
        const msgs = { NotAllowedError: 'Permita o acesso à câmera nas configurações do navegador.', NotFoundError: 'Nenhuma câmera encontrada neste aparelho.', NotReadableError: 'A câmera está em uso por outro app. Feche-o e tente de novo.', OverconstrainedError: 'Esta câmera não suporta a resolução pedida.' };
        let el = document.getElementById('cam-erro');
        if (!el) { el = document.createElement('div'); el.id = 'cam-erro'; document.getElementById('app').appendChild(el); }
        el.innerHTML = '<div><div style="font-size:42px">📷</div><p>' + (msgs[err.name] || 'Não foi possível abrir a câmera.') + '</p><button id="cam-retry">TENTAR DE NOVO</button></div>';
        document.getElementById('cam-retry').onclick = () => { el.remove(); initCamera(); };
    }

    function idb() { return new Promise((res, rej) => { const r = indexedDB.open('pm_fila', 1); r.onupgradeneeded = () => r.result.createObjectStore('videos', { keyPath: 'name' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
    async function filaOp(modo, fn) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('videos', modo); const rq = fn(tx.objectStore('videos')); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); }); }
    const filaSalvar = item => filaOp('readwrite', s => s.put(item));
    const filaListar = () => filaOp('readonly', s => s.getAll());
    const filaRemover = name => filaOp('readwrite', s => s.delete(name));
    async function atualizarFila() {
        let n = 0; try { n = (await filaListar()).length; } catch (e) {}
        const el = document.getElementById('fila-badge'); if (!el) return;
        el.style.display = n ? 'block' : 'none'; el.textContent = '⏳ ' + n + ' vídeo(s) na fila de envio';
    }
    function enviarXHR(item, onP) {
        return new Promise((res, rej) => {
            const fd = new FormData(); fd.append('file', item.blob, item.name); fd.append('uuid', item.name); fd.append('evento', item.evento);
            const x = new XMLHttpRequest(); x.open('POST', WORKER_URL + '/upload'); x.timeout = 180000;
            x.upload.onprogress = e => { if (e.lengthComputable && onP) onP(Math.round(e.loaded / e.total * 100)); };
            x.onload = () => (x.status >= 200 && x.status < 300) ? res() : rej(new Error('HTTP ' + x.status));
            x.onerror = () => rej(new Error('rede')); x.ontimeout = () => rej(new Error('tempo esgotado')); x.send(fd);
        });
    }
    async function enviarComRetry(item, onP) {
        let err; for (let i = 0; i < 3; i++) { try { await enviarXHR(item, onP); return; } catch (e) { err = e; await new Promise(r => setTimeout(r, 1500 * (i + 1))); } }
        throw err;
    }
    let enviandoFila = false;
    async function processarFila() {
        if (enviandoFila || !navigator.onLine) return; enviandoFila = true;
        try { for (const it of await filaListar()) { try { await enviarXHR(it); await filaRemover(it.name); } catch (e) { break; } } } catch (e) {}
        enviandoFila = false; atualizarFila();
    }

    function startRecording() {
        chunks = [];
        const config = JSON.parse(localStorage.getItem('config_atual'));
        const duration = ((config && parseInt(config.tempo)) || 10);

        function renderLoop() {
            if (!isRecording) return; 
            
            ctx.save();
            
            // Se for câmera frontal, espelha o canvas
            if (isFrontCamera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.restore();
            
            animationId = requestAnimationFrame(renderLoop);
        }

        const videoStream = canvas.captureStream(30);
        const audioTracks = stream.getAudioTracks();
        let finalStream = videoStream;
        if (audioTracks.length > 0) {
            const audioStream = new MediaStream(audioTracks);
            finalStream = new MediaStream([...videoStream.getVideoTracks(), ...audioStream.getAudioTracks()]);
        }

        let selectedMime = 'video/webm';
        if (MediaRecorder.isTypeSupported('video/mp4')) {
            selectedMime = 'video/mp4';
        }

        recorder = new MediaRecorder(finalStream, { 
            mimeType: selectedMime, 
            videoBitsPerSecond: 4000000
        });
        
        recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = uploadVideo;
        recorder.start(500);
        renderLoop();

        let timeLeft = duration;
        const timer = document.getElementById('timer-display');
        timer.style.display = 'block';
        timer.innerText = timeLeft + "s";
        timer.style.color = '#ff0033';

        let clock = setInterval(() => {
            timeLeft--;
            
            if (timeLeft <= 3 && timeLeft > 0) {
                warningFlash.style.display = 'block';
            } else {
                warningFlash.style.display = 'none';
            }

            if (timeLeft > 0) {
                timer.innerText = timeLeft + "s";
                timer.style.color = '#ff0033';
            } else {
                clearInterval(clock);
                warningFlash.style.display = 'none';
                timer.style.display = 'none';
                isRecording = false; 
                recBtn.style.opacity = "1";
                if(recorder.state === "recording") recorder.stop(); 
            }
        }, 1000);
    }

    async function uploadVideo() {
        const loader = document.getElementById('loader'), txt = document.getElementById('loader-text');
        loader.style.display = 'flex'; txt.textContent = 'ENVIANDO VÍDEO...';
        if (animationId) cancelAnimationFrame(animationId);
        const config = JSON.parse(localStorage.getItem('config_atual') || 'null');
        const isWebm = recorder.mimeType.includes('webm');
        const fileName = 'vid_' + Date.now() + (isWebm ? '.webm' : '.mp4');
        const item = { name: fileName, evento: String((config && config.id) || 'Geral'), blob: new Blob(chunks, { type: isWebm ? 'video/webm' : 'video/mp4' }) };
        try {
            await enviarComRetry(item, p => { txt.textContent = 'ENVIANDO VÍDEO... ' + p + '%'; });
            localStorage.setItem('voltar_para_camera', 'true');
            window.location.href = 'galeria_admin.html';
        } catch (err) {
            try { await filaSalvar(item); alert('Sem conexão. O vídeo foi guardado e será enviado automaticamente.'); }
            catch (e2) { alert('Falha no envio e no armazenamento local.'); }
            loader.style.display = 'none'; atualizarFila();
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOTO MOVIE - Câmera</title>
    <style>
        :root { --bg: #001a1a; --dourado: #c5a059; --vermelho: #ff3b30; }
        body { margin: 0; background: var(--bg); overflow: hidden; color: white; font-family: 'Segoe UI', sans-serif; }
        #app { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        #moldura-overlay { 
            position: absolute; inset: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 5; display: none; object-fit: cover; 
        }
        
        .header { 
            position: absolute; top: 40px; width: 100%; text-align: center; z-index: 10; 
            text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 10px rgba(0,0,0,0.9); 
        }
        #event-name { color: var(--dourado); font-weight: bold; font-size: 16px; }
        #timer-display { font-size: 32px; font-weight: bold; margin-top: 10px; display: none; color: white; }
        
        .controls { 
            position: absolute; bottom: 80px; width: 100%; display: flex; justify-content: space-around; align-items: center; z-index: 10; 
        }
        .btn { 
            width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--dourado); 
            background: rgba(0,0,0,0.5); color: var(--dourado); display: flex; align-items: center; justify-content: center; cursor: pointer; 
            font-size: 20px; backdrop-filter: blur(5px);
        }
        
        /* Botão do Microfone */
        #btn-mic { color: var(--dourado); border-color: var(--dourado); }
        #btn-mic.muted { color: var(--vermelho); border-color: var(--vermelho); }

        .shutter { width: 80px; height: 80px; border: 4px solid var(--dourado); }
        .shutter:active { transform: scale(0.9); }
        
        #loader { 
            position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; 
            background: rgba(0, 0, 0, 0.85); flex-direction: column; color: var(--dourado);
        }
        .spin { 
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: var(--dourado); 
            border-radius: 50%; animation: rotate 1s linear infinite; 
        }
        @keyframes rotate { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <span id="event-name">PHOTO MOVIE</span>
            <div id="timer-display">3</div>
        </div>
        <video id="preview" autoplay playsinline></video>
        <img id="moldura-overlay">
        
        <div class="controls">
            <div class="btn" onclick="window.location.href='index.html'">✕</div>
            <div class="btn shutter" id="rec-btn"></div>
            
            <!-- NOVO BOTÃO DE MICROFONE -->
            <div class="btn" id="btn-mic" onclick="toggleMicrofone()">🎤</div>
        </div>
    </div>
    
    <canvas id="canvas" style="position: absolute; left: -9999px; visibility: hidden;"></canvas>

    <div id="loader">
        <div class="spin"></div>
        <p style="margin-top:20px; letter-spacing: 2px;">ENVIANDO VÍDEO...</p>
    </div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev"; 
    
    const video = document.getElementById('preview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
    
    const molduraImg = new Image();
    let stream, recorder, chunks = [];
    let isFrontCamera = false, isRecording = false;
    let isMicActive = true; // Controle do microfone
    let animationId = null;

    async function initCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            // Inicia com o audio ativo baseado na variavel isMicActive
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: isFrontCamera ? "user" : "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: isMicActive 
            });
            video.srcObject = stream;
            
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            };

            // Atualiza o ícone do microfone visualmente
            atualizarIconeMic();

        } catch (err) { 
            if(err.name === 'NotAllowedError') {
                alert("Permissão de microfone negada. Verifique as configurações do navegador.");
            } else {
                alert("Erro ao acessar a câmera."); 
            }
        }
    }

    // Função para ligar/desligar o microfone
    async function toggleMicrofone() {
        if (isRecording) {
            alert("Não é possível alterar o microfone durante a gravação.");
            return;
        }
        
        isMicActive = !isMicActive;
        await initCamera(); // Reinicia a câmera com a nova configuração de áudio
    }

    // Função para mudar a cor do botão do microfone
    function atualizarIconeMic() {
        const micBtn = document.getElementById('btn-mic');
        if (isMicActive) {
            micBtn.classList.remove('muted');
            micBtn.innerText = "🎤";
        } else {
            micBtn.classList.add('muted');
            micBtn.innerText = "🔇";
        }
    }

    function switchCamera() { 
        if (!isRecording) { 
            isFrontCamera = !isFrontCamera; 
            initCamera(); 
        } 
    }

    window.onload = () => {
        const config = JSON.parse(localStorage.getItem('config_atual'));
        if (config) {
            document.getElementById('event-name').innerText = config.nome || "PHOTO MOVIE";
            let path = config.molduraUrl || config.moldura;
            if (path) {
                const id = path.includes('id=') ? path.split('id=')[1] : path;
                const url = `${WORKER_URL}/stream?id=${id}`;
                molduraImg.src = url;
                document.getElementById('moldura-overlay').src = url;
                molduraImg.onload = () => document.getElementById('moldura-overlay').style.display = 'block';
            }
        }
        initCamera();
    };

    document.getElementById('rec-btn').onclick = function() {
        if (isRecording) return;
        isRecording = true;
        this.style.opacity = "0.2";
        let count = 3;
        const timer = document.getElementById('timer-display');
        timer.style.display = 'block';
        timer.innerText = count;
        
        let countdown = setInterval(() => {
            count--;
            if (count > 0) timer.innerText = count;
            else { 
                clearInterval(countdown); 
                startRecording(); 
            }
        }, 1000);
    };

    function startRecording() {
        chunks = [];
        const config = JSON.parse(localStorage.getItem('config_atual'));
        const duration = (config ? parseInt(config.tempo) : 10);

        function renderLoop() {
            if (!isRecording) return; 
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            if (molduraImg.complete && molduraImg.naturalWidth > 0) {
                ctx.drawImage(molduraImg, 0, 0, canvas.width, canvas.height);
            }
            animationId = requestAnimationFrame(renderLoop);
        }

        // Mescla o Vídeo do Canvas com o Áudio da Câmera
        const videoStream = canvas.captureStream(30);
        const audioTracks = stream.getAudioTracks();
        
        let finalStream = videoStream;
        if (audioTracks.length > 0) {
            const audioStream = new MediaStream(audioTracks);
            finalStream = new MediaStream([
                ...videoStream.getVideoTracks(),
                ...audioStream.getAudioTracks()
            ]);
        }

        recorder = new MediaRecorder(finalStream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 5000000 });
        recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = uploadVideo;
        recorder.start(100);
        renderLoop(); 

        let timeLeft = duration;
        const timer = document.getElementById('timer-display');
        let clock = setInterval(() => {
            timeLeft--;
            timer.innerText = timeLeft + "s";
            if (timeLeft <= 0) {
                clearInterval(clock);
                isRecording = false; 
                if(recorder.state === "recording") recorder.stop(); 
            }
        }, 1000);
    }

    async function uploadVideo() {
        document.getElementById('loader').style.display = 'flex';
        if (animationId) cancelAnimationFrame(animationId);

        const config = JSON.parse(localStorage.getItem('config_atual'));
        const eventFolder = config.id || "Geral"; 
        
        const blob = new Blob(chunks, { type: 'video/webm' });
        
        const formData = new FormData();
        const fileName = `vid_${Date.now()}.webm`;
        formData.append("file", blob, fileName); 
        formData.append("uuid", fileName);
        formData.append("evento", String(eventFolder));

        try {
            const res = await fetch(`${WORKER_URL}/upload`, { method: "POST", body: formData });
            if (res.ok) {
                window.location.href = 'galeria_admin.html';
            } else {
                alert("Erro no envio do vídeo.");
                document.getElementById('loader').style.display = 'none';
            }
        } catch (err) { 
            alert("Erro de conexão ao enviar."); 
            document.getElementById('loader').style.display = 'none';
        }
    }
</script>
</body>
</html>

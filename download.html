<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DOWNLOAD - Photo Movie</title>
    
<meta name="theme-color" content="#000000">
<!-- link do manifest removido de propósito: esta página é do cliente, não do app do operador -->
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Movie">
<link rel="stylesheet" href="app.css">
<script src="pwa.js" defer></script>
</head>
<body class="pg-dl">

    <div class="header">
        <h1>PHOTO MOVIE</h1>
        <span id="video-number">CARREGANDO...</span>
    </div>

    <div class="video-preview">
        <video id="player" controls playsinline autoplay loop muted crossorigin="anonymous"></video>
    </div>

    <button id="btn-download" class="btn-download">BAIXAR VÍDEO</button>
    
    <a href="index.html" class="btn-back">← Voltar ao Início</a>

<script>
    // 1. Definições globais - Alinhado com seu Worker
    const WORKER_URL = 'https://photomovie.maxprimefotovideo.workers.dev';
    
    // 2. Função principal de carregamento
    async function carregarVideo() {
        const params = new URLSearchParams(window.location.search);
        const videoId = params.get('id');
        const numero = params.get('n');

        const player = document.getElementById('player');
        const downloadBtn = document.getElementById('btn-download');
        const numLabel = document.getElementById('video-number');

        // Se o ID existir na URL
        if (videoId && videoId !== "null") {
            // ▼▼▼ [INÍCIO] CORRIGIDO: o id agora é codificado (caminho com / e espaços) ▼▼▼
            const videoSrc = `${WORKER_URL}/stream?id=${encodeURIComponent(videoId)}`;
            // ▲▲▲ [FIM] CORRIGIDO ▲▲▲
            
            numLabel.innerText = numero ? `VÍDEO #${numero}` : `VÍDEO 360°`;
            player.src = videoSrc;

            downloadBtn.onclick = async () => {
                const originalText = downloadBtn.innerText;
                downloadBtn.innerText = "PREPARANDO...";
                downloadBtn.disabled = true;

                try {
                    // Tenta baixar via Blob (mais profissional, renomeia o arquivo)
                    const response = await fetch(videoSrc);
                    if (!response.ok) throw new Error("Erro no download");
                    
                    const blob = await response.blob();
                    const urlBlob = window.URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = urlBlob;
                    a.download = `photo-movie-${numero || Date.now()}.mp4`;
                    document.body.appendChild(a);
                    a.click();
                    
                    // Limpeza
                    setTimeout(() => {
                        window.URL.revokeObjectURL(urlBlob);
                        document.body.removeChild(a);
                    }, 100);

                } catch (e) {
                    console.error("Falha no blob, usando fallback:", e);
                    // Fallback: Abre o link direto em nova aba para o usuário salvar
                    window.open(videoSrc, '_blank');
                } finally {
                    downloadBtn.innerText = originalText;
                    downloadBtn.disabled = false;
                }
            };
        } else {
            numLabel.innerText = "VÍDEO NÃO ENCONTRADO";
            numLabel.style.color = "#ff4444";
            downloadBtn.style.display = "none";
        }
    }

    // Inicializa
    carregarVideo();
</script>
</body>
</html>

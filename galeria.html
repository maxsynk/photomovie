<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:title" content="Galeria de Fotos - Photo Movie">
    <meta property="og:description" content="Acesse suas fotos do evento aqui.">
    <meta property="og:image" content="https://maxsynk.github.io/photomovie/seu-logo.png">
    <meta property="og:url" content="https://maxsynk.github.io/photomovie/galeria.html">
    <title>PHOTO MOVIE - GALERIA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root { --turquesa: #00d1d1; --dourado: #c5a059; --bg: #001a1a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; min-height: 100vh; overflow-x: hidden; }
        
        .sticky-top { position: sticky; top: 0; z-index: 100; background: var(--bg); }
        .header { padding: 20px; border-bottom: 2px solid var(--dourado); background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        .header h1 { color: var(--dourado); letter-spacing: 5px; margin: 0; text-transform: uppercase; font-size: 1.8rem; font-weight: 900; }
        .subtitle { font-size: 11px; letter-spacing: 4px; opacity: 0.9; margin-top: 2px; text-transform: uppercase; color: var(--dourado); }
        .version-tag { font-size: 9px; color: rgba(197, 160, 89, 0.4); font-family: monospace; display: block; margin-top: 2px; letter-spacing: 1px; }
        
        .event-info-container { display: flex; align-items: center; justify-content: flex-start; width: 100%; margin-top: 15px; padding-left: 10px; cursor: pointer; }
        .v-line { width: 2px; height: 30px; background: var(--dourado); border-radius: 2px; margin-right: 10px; }
        #nome-evento-titulo { color: var(--dourado); font-size: 13px; margin: 0; letter-spacing: 1px; text-transform: uppercase; font-weight: bold; }

        .search-area { padding: 15px; background: rgba(0,0,0,0.9); display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid rgba(197, 160, 89, 0.2); }
        .search-area input { width: 180px; padding: 12px; border-radius: 8px; border: 1px solid var(--dourado); background: #000; color: var(--dourado); text-align: center; font-size: 18px; outline: none; }
        .btn-busca { background: var(--dourado); color: black; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 15px; padding-bottom: 120px; }
        .video-card { background: #000; border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 12px; overflow: hidden; aspect-ratio: 9/16; position: relative; cursor: pointer; }
        .video-card:hover { border-color: var(--dourado); }
        .video-number { position: absolute; top: 10px; right: 10px; color: var(--dourado); font-weight: bold; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; z-index: 5; font-size: 12px; }
        .video-thumb { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .video-card video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; opacity: 0; z-index: 2; }
        .video-card:hover video { opacity: 1; }
        .video-card:hover .video-thumb { opacity: 0; }
        
        .loading-thumb { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--dourado); font-size: 12px; }

        #modal-zoom { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #media-full { width: 90%; max-height: 70vh; border: 2px solid var(--dourado); border-radius: 15px; background: #000; }
        .modal-controls { margin-top: 25px; display: flex; gap: 15px; width: 90%; justify-content: center; flex-wrap: wrap; }
        .btn-action { padding: 12px 25px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; }
        .btn-close { background: #333; color: white; }
        .btn-download { background: var(--dourado); color: black; }
        
        .nav-footer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 500; width: 90%; }
        .btn-footer { background: rgba(197, 160, 89, 0.1); color: var(--dourado); border: 1px solid var(--dourado); padding: 12px; border-radius: 10px; display: block; font-weight: bold; text-decoration: none; text-align: center; }
        
        .empty-gallery { text-align: center; padding: 50px; color: #666; grid-column: 1/-1; }
        .empty-gallery p { font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="sticky-top">
        <div class="header">
            <h1 id="logo-exit">PHOTO MOVIE</h1>
            <p class="subtitle">COLECIONANDO MOMENTOS</p>
            <span class="version-tag">v1.0.4</span>
            <div class="event-info-container" onclick="copiarLinkGaleria()">
                <div class="v-line"></div>
                <p id="nome-evento-titulo">CARREGANDO...</p>
            </div>
        </div>
        <div class="search-area">
            <input type="number" id="input-busca" placeholder="Nº VÍDEO">
            <button class="btn-busca" onclick="executarBusca()">🔍 BUSCAR</button>
        </div>
    </div>

    <div id="gallery-container" class="gallery-grid">
        <div class="empty-gallery">
            <p>📹 Nenhum vídeo encontrado</p>
            <small>Grave um vídeo na câmera para aparecer aqui</small>
        </div>
    </div>

    <div class="nav-footer">
        <div class="btn-footer">📸 PHOTO MOVIE 360º</div>
    </div>

    <div id="modal-zoom">
        <video id="media-full" controls playsinline crossorigin="anonymous"></video>
        <div class="modal-controls">
            <button class="btn-action btn-close" onclick="fecharZoom()">FECHAR</button>
            <button id="btn-download-force" class="btn-action btn-download">📥 BAIXAR VÍDEO</button>
        </div>
    </div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
    let listaArquivosAtuais = [];
    let idPastaFixo = ""; 
    let carregando = false;

    function bloquearVoltar() {
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function () {
            window.history.go(1);
        };
    }

    let cliquesSaida = 0;
    document.getElementById('logo-exit').onclick = () => {
        if(++cliquesSaida >= 7) {
            window.location.href = 'index.html';
        }
    };

    function copiarLinkGaleria() {
        if(!idPastaFixo) {
            alert("Aguardando carregamento do evento...");
            return;
        }
        const link = `${window.location.origin}${window.location.pathname}?evento=${encodeURIComponent(idPastaFixo)}`;
        navigator.clipboard.writeText(link).then(() => {
            alert("✅ Link da Galeria Copiado!\n" + link);
        }).catch(() => {
            alert("Link: " + link);
        });
    }

    // Função para capturar thumbnail do vídeo
    function gerarThumbnail(videoUrl, callback) {
        const video = document.createElement('video');
        video.crossOrigin = 'anonymous';
        video.muted = true;
        video.preload = 'metadata';
        
        video.onloadeddata = () => {
            // Avançar para 0.5 segundos para capturar um frame
            video.currentTime = 0.5;
        };
        
        video.onseeked = () => {
            // Criar canvas para capturar o frame
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Converter para URL de dados
            const thumbnailUrl = canvas.toDataURL('image/jpeg', 0.8);
            callback(thumbnailUrl);
            
            // Limpar
            video.src = '';
            video.load();
        };
        
        video.onerror = () => {
            console.error('Erro ao carregar vídeo para thumbnail:', videoUrl);
            callback(null);
        };
        
        video.src = videoUrl;
        video.load();
    }

    async function sincronizarInterface() {
        if(carregando) return;
        carregando = true;
        
        try {
            const urlParams = new URLSearchParams(window.location.search);
            let eventoEncontrado = urlParams.get('evento');

            if(!eventoEncontrado) {
                const gDados = localStorage.getItem('config_atual');
                if(gDados) {
                    const config = JSON.parse(gDados);
                    eventoEncontrado = config.nome || config.id || config.id_fixo;
                }
            }
            
            if(!eventoEncontrado) {
                try {
                    const res = await fetch(`${WORKER_URL}/listar-eventos?t=${Date.now()}`);
                    const eventos = await res.json();
                    if(eventos && eventos.length > 0) {
                        eventoEncontrado = eventos[0].nome;
                    }
                } catch(e) {
                    console.log("Erro ao buscar eventos:", e);
                }
            }

            if(!eventoEncontrado) {
                document.getElementById('nome-evento-titulo').innerHTML = "⚠️ NENHUM EVENTO";
                document.getElementById('gallery-container').innerHTML = '<div class="empty-gallery"><p>❌ Nenhum evento encontrado</p><small>Crie um evento no menu principal</small></div>';
                carregando = false;
                return;
            }
            
            idPastaFixo = eventoEncontrado;
            document.getElementById('nome-evento-titulo').innerHTML = eventoEncontrado.replace(/_/g, ' ');

            const url = `${WORKER_URL}/listar-galeria?evento=${encodeURIComponent(eventoEncontrado)}&t=${Date.now()}`;
            console.log("🔍 Buscando:", url);
            
            const res = await fetch(url);
            const dados = await res.json();
            
            console.log("📦 Arquivos encontrados:", dados);
            
            let novos = dados.filter(f => {
                const path = f.path || "";
                const filename = path.split('/').pop();
                return filename.startsWith('final_') && filename.endsWith('.mp4');
            });
            
            novos.reverse();
            
            console.log("🎬 Vídeos finais:", novos.length);
            
            if (JSON.stringify(novos) !== JSON.stringify(listaArquivosAtuais)) {
                listaArquivosAtuais = novos;
                renderizar();
            }
        } catch (e) {
            console.error("❌ Erro na sincronização:", e);
            document.getElementById('gallery-container').innerHTML = '<div class="empty-gallery"><p>⚠️ Erro ao carregar galeria</p><small>Verifique sua conexão</small></div>';
        } finally {
            carregando = false;
        }
    }

    function renderizar() {
        const container = document.getElementById('gallery-container');
        
        if (!listaArquivosAtuais || listaArquivosAtuais.length === 0) {
            container.innerHTML = '<div class="empty-gallery"><p>📹 Nenhum vídeo encontrado</p><small>Grave um vídeo na câmera para aparecer aqui</small></div>';
            return;
        }
        
        container.innerHTML = "";
        
        listaArquivosAtuais.forEach((file, index) => {
            const url = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
            const numeroRealVideo = listaArquivosAtuais.length - index;
            
            const card = document.createElement('div');
            card.className = 'video-card';
            
            // Estrutura: thumb + video (hover mostra video)
            card.innerHTML = `
                <div class="video-number">#${numeroRealVideo}</div>
                <img class="video-thumb" src="" alt="Thumbnail">
                <video muted playsinline preload="metadata"></video>
                <div class="loading-thumb">⏳</div>
            `;
            
            const thumbImg = card.querySelector('.video-thumb');
            const videoElement = card.querySelector('video');
            const loadingDiv = card.querySelector('.loading-thumb');
            
            // Configurar vídeo
            videoElement.src = url;
            videoElement.load();
            
            // Gerar thumbnail
            gerarThumbnail(url, (thumbnailUrl) => {
                loadingDiv.style.display = 'none';
                if (thumbnailUrl) {
                    thumbImg.src = thumbnailUrl;
                } else {
                    // Fallback: usar um ícone
                    thumbImg.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23c5a059"><path d="M8 5v14l11-7z"/></svg>';
                }
            });
            
            card.onclick = () => abrirZoom(url, file.path);
            container.appendChild(card);
        });
    }

    function executarBusca() {
        const numeroBuscado = parseInt(document.getElementById('input-busca').value);
        if (isNaN(numeroBuscado)) {
            alert("Digite um número de vídeo válido");
            return;
        }

        const totalVideos = listaArquivosAtuais.length;
        if (totalVideos === 0) {
            alert("Nenhum vídeo disponível na galeria");
            return;
        }
        
        const indexNoArray = totalVideos - numeroBuscado;

        if (listaArquivosAtuais[indexNoArray]) {
            const file = listaArquivosAtuais[indexNoArray];
            const url = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
            abrirZoom(url, file.path);
            document.getElementById('input-busca').value = '';
        } else {
            alert(`❌ Vídeo #${numeroBuscado} não encontrado.\nTotal de vídeos: ${totalVideos}`);
        }
    }

    function abrirZoom(url, path) {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        
        video.pause();
        video.src = "";
        
        modal.style.display = 'flex';
        video.src = url;
        video.load();
        
        const playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.log("Auto-play bloqueado:", error);
                video.controls = true;
            });
        }
        
        document.getElementById('btn-download-force').onclick = async () => {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const filename = path.split('/').pop();
                saveAs(blob, filename);
            } catch(e) {
                alert("Erro ao baixar vídeo: " + e.message);
            }
        };
    }

    function fecharZoom() {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        modal.style.display = 'none';
        video.pause();
        video.src = "";
    }

    window.onload = () => {
        bloquearVoltar();
        sincronizarInterface();
        setInterval(sincronizarInterface, 10000);
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO MOVIE - GALERIA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #001a1a; color: white; font-family: Arial, sans-serif; }
        
        .header {
            background: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #c5a059;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { color: #c5a059; font-size: 24px; cursor: pointer; }
        
        .evento-nome {
            text-align: center;
            padding: 10px;
            background: #002222;
            color: #c5a059;
            font-size: 14px;
        }
        
        .search {
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            background: #000;
        }
        .search input {
            padding: 12px;
            width: 150px;
            border: 1px solid #c5a059;
            background: #000;
            color: #c5a059;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }
        .search button {
            padding: 12px 20px;
            background: #c5a059;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
            padding-bottom: 100px;
        }
        
        .video-card {
            background: #000;
            border: 2px solid #c5a05930;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            cursor: pointer;
        }
        
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-number {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: #c5a059;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal video {
            width: 90%;
            max-height: 70vh;
            border: 3px solid #c5a059;
            border-radius: 15px;
            background: #000;
        }
        
        .modal-buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        
        .modal-buttons button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-fechar { background: #333; color: white; }
        .btn-baixar { background: #c5a059; color: black; }
        
        .empty {
            text-align: center;
            padding: 50px;
            color: #666;
            grid-column: 1/-1;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            text-align: center;
            background: #000;
            border-top: 1px solid #c5a059;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #c5a059;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="logo-exit">PHOTO MOVIE</h1>
</div>
<div class="evento-nome" id="evento-nome">CARREGANDO...</div>
<div class="search">
    <input type="number" id="busca" placeholder="Nº VÍDEO">
    <button onclick="buscarVideo()">🔍 BUSCAR</button>
</div>

<div class="gallery" id="gallery">
    <div class="loading">⏳ CARREGANDO VÍDEOS...</div>
</div>

<div class="footer">
    <div style="color:#c5a059;">📸 PHOTO MOVIE 360º</div>
</div>

<div class="modal" id="modal">
    <video id="modal-video" controls playsinline webkit-playsinline preload="metadata"></video>
    <div class="modal-buttons">
        <button class="btn-fechar" onclick="fecharModal()">FECHAR</button>
        <button class="btn-baixar" id="btn-baixar">📥 BAIXAR</button>
    </div>
</div>

<script>
const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
let videos = [];
let eventoAtual = "";

let cliquesSaida = 0;
document.getElementById('logo-exit').onclick = () => {
    if(++cliquesSaida >= 7) {
        window.location.href = 'index.html';
    }
};

async function carregar() {
    const gallery = document.getElementById('gallery');
    
    const modal = document.getElementById('modal');
    if (modal.style.display === 'flex') return;

    if (videos.length === 0) gallery.innerHTML = '<div class="loading">⏳ CARREGANDO VÍDEOS...</div>';
    
    try {
        const params = new URLSearchParams(location.search);
        let evento = params.get('evento');
        
        if (!evento) {
            const config = localStorage.getItem('config_atual');
            if (config) {
                try {
                    evento = JSON.parse(config).nome;
                } catch(e) {}
            }
        }
        
        if (!evento) {
            const res = await fetch(`${WORKER_URL}/listar-eventos?t=${Date.now()}`);
            const eventos = await res.json();
            if (eventos.length > 0) {
                evento = eventos[0].nome;
            }
        }
        
        if (!evento) {
            gallery.innerHTML = '<div class="empty">❌ NENHUM EVENTO ENCONTRADO</div>';
            document.getElementById('evento-nome').innerHTML = "⚠️ NENHUM EVENTO";
            return;
        }
        
        eventoAtual = evento;
        document.getElementById('evento-nome').innerHTML = evento.replace(/_/g, ' ');
        
        const res = await fetch(`${WORKER_URL}/listar-galeria?evento=${encodeURIComponent(evento)}&t=${Date.now()}`);
        const arquivos = await res.json();
        
        const novosVideos = arquivos.filter(f => {
            const nome = f.path.split('/').pop();
            return nome.startsWith('final_') && nome.endsWith('.mp4');
        }).reverse();
        
        if (novosVideos.length !== videos.length) {
            videos = novosVideos;
            if (videos.length === 0) {
                gallery.innerHTML = '<div class="empty">📹 NENHUM VÍDEO ENCONTRADO<br><small>Grave um vídeo na câmera</small></div>';
            } else {
                renderizar();
            }
        }
        
    } catch (error) {
        console.error("Erro:", error);
    }
}

function renderizar() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    
    videos.forEach((video, index) => {
        const numero = videos.length - index;
        const videoUrl = `${WORKER_URL}/stream?id=${encodeURIComponent(video.path)}`;
        
        const card = document.createElement('div');
        card.className = 'video-card';
        
        const videoElem = document.createElement('video');
        videoElem.src = videoUrl;
        videoElem.muted = true;
        videoElem.setAttribute('playsinline', '');
        videoElem.setAttribute('webkit-playsinline', '');
        videoElem.preload = "metadata";
        
        // Linha removida para evitar o travamento em 0 segundos no mobile
        
        const numberDiv = document.createElement('div');
        numberDiv.className = 'video-number';
        numberDiv.textContent = `#${numero}`;
        
        card.appendChild(videoElem);
        card.appendChild(numberDiv);
        
        card.onclick = () => abrirVideo(videoUrl, video.path);
        
        gallery.appendChild(card);
    });
}

function abrirVideo(url, path) {
    const modal = document.getElementById('modal');
    const video = document.getElementById('modal-video');
    
    video.pause();
    modal.style.display = 'flex';
    video.src = url;
    video.load();
    
    setTimeout(() => {
        video.play().catch(e => {
            console.log("Auto-play bloqueado:", e);
        });
    }, 100);
    
    document.getElementById('btn-baixar').onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = path.split('/').pop();
        a.click();
    };
}

function fecharModal() {
    const modal = document.getElementById('modal');
    const video = document.getElementById('modal-video');
    modal.style.display = 'none';
    video.pause();
    video.src = "";
}

function buscarVideo() {
    const num = parseInt(document.getElementById('busca').value);
    if (isNaN(num)) {
        alert("Digite um número válido");
        return;
    }
    
    const index = videos.length - num;
    if (videos[index]) {
        const videoUrl = `${WORKER_URL}/stream?id=${encodeURIComponent(videos[index].path)}`;
        abrirVideo(videoUrl, videos[index].path);
    } else {
        alert(`Vídeo #${num} não encontrado. Total: ${videos.length}`);
    }
}

carregar();
setInterval(carregar, 10000);
</script>
</body>
</html>

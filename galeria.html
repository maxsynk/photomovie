VERSÃO: 2.0.2
ÚLTIMA ATUALIZAÇÃO: 09/08/2026

CHANGELOG v2.0.2:
- ADICIONADO: Thumbnails nos cards (imagem .jpg gerada pelo processador)
- ADICIONADO: Fallback para vídeo se thumbnail não existir
- CORRIGIDO: Cards mostram capa do vídeo em vez de tela preta
- OTIMIZADO: Thumbnail carrega muito mais rápido que o vídeo

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOTO MOVIE - GALERIA v2.0.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #001a1a; color: white; font-family: 'Segoe UI', Arial, sans-serif; }
        
        .header {
            background: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #c5a059;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { 
            color: #c5a059; 
            font-size: 24px; 
            cursor: pointer; 
            letter-spacing: 3px;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .evento-nome {
            text-align: center;
            padding: 10px;
            background: #002222;
            color: #c5a059;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .search {
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            background: #000;
            border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }
        .search input {
            padding: 12px;
            width: 160px;
            border: 1px solid #c5a059;
            background: #000;
            color: #c5a059;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            outline: none;
        }
        .search button {
            padding: 12px 20px;
            background: #c5a059;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            padding: 15px;
            padding-bottom: 100px;
        }
        
        .video-card {
            background: #000;
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            cursor: pointer;
        }
        .video-card:hover { border-color: #c5a059; }
        
        /* 🔥 Thumbnail como imagem */
        .video-card .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        /* Ícone de play */
        .video-card .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }
        .video-card .play-icon::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 14px solid white;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            margin-left: 3px;
        }
        
        .video-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #c5a059;
            color: black;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 900;
            z-index: 10;
        }
        
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal video {
            width: 90%;
            max-height: 70vh;
            border: 2px solid #c5a059;
            border-radius: 15px;
            background: #000;
        }
        
        .modal-buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        
        .modal-buttons button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        .btn-fechar { background: #333; color: white; }
        .btn-baixar { background: #c5a059; color: black; }
        
        .empty {
            text-align: center;
            padding: 50px;
            color: #666;
            grid-column: 1/-1;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            text-align: center;
            background: #000;
            border-top: 1px solid #c5a059;
            z-index: 50;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #c5a059;
            grid-column: 1/-1;
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="logo-exit">PHOTO MOVIE</h1>
</div>
<div class="evento-nome" id="evento-nome">CARREGANDO...</div>

<div class="search">
    <input type="number" id="busca" placeholder="Nº VÍDEO">
    <button onclick="buscarVideo()">🔍 BUSCAR</button>
</div>

<div class="gallery" id="gallery">
    <div class="loading">⏳ CARREGANDO VÍDEOS...</div>
</div>

<div class="footer">
    <div style="color:#c5a059; font-weight: bold; font-size: 13px; letter-spacing: 1px;">📸 PHOTO MOVIE</div>
</div>

<div class="modal" id="modal">
    <video id="modal-video" controls playsinline webkit-playsinline crossorigin="anonymous" preload="metadata"></video>
    <div class="modal-buttons">
        <button class="btn-fechar" onclick="fecharModal()">FECHAR</button>
        <button class="btn-baixar" id="btn-baixar">📥 BAIXAR MP4</button>
    </div>
</div>

<script>
const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
let idPastaFixo = "";
let carregando = false;

const videosMap = new Map();
let listaCronologica = [];

function travarBotaoVoltar() {
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        history.pushState(null, null, location.href);
    };
}
travarBotaoVoltar();

let cliquesSaida = 0;
document.getElementById('logo-exit').onclick = () => {
    cliquesSaida++;
    if (cliquesSaida >= 7) {
        window.location.href = 'index.html';
    }
};

window.onload = () => {
    carregarEvento();
};

async function carregarEvento() {
    const params = new URLSearchParams(location.search);
    let evento = params.get('evento');
    
    if (!evento) {
        const config = localStorage.getItem('config_atual');
        if (config) {
            try {
                const parsed = JSON.parse(config);
                evento = parsed.id || parsed.nome || parsed.id_fixo;
            } catch(e) {}
        }
    }
    
    if (!evento) {
        try {
            const res = await fetch(`${WORKER_URL}/listar-eventos?t=${Date.now()}`);
            const eventos = await res.json();
            if (eventos && eventos.length > 0) {
                evento = eventos[0].id;
            }
        } catch(e) {}
    }
    
    if (!evento) {
        document.getElementById('gallery').innerHTML = '<div class="empty"><p>❌ NENHUM EVENTO ENCONTRADO</p></div>';
        document.getElementById('evento-nome').innerHTML = "⚠️ NENHUM EVENTO SELECIONADO";
        return;
    }
    
    idPastaFixo = String(evento);
    document.getElementById('evento-nome').innerHTML = "EVENTO: " + idPastaFixo.replace(/_/g, ' ');
    
    videosMap.clear();
    listaCronologica = [];
    document.getElementById('gallery').innerHTML = '';
    
    await atualizarGaleriaIncremental();
    setInterval(atualizarGaleriaIncremental, 5000);
}

async function atualizarGaleriaIncremental() {
    if (carregando) return;
    const modal = document.getElementById('modal');
    if (modal.style.display === 'flex') return;
    
    carregando = true;
    try {
        const res = await fetch(`${WORKER_URL}/listar-galeria?evento=${encodeURIComponent(idPastaFixo)}&t=${Date.now()}`);
        const arquivos = await res.json();
        
        const finais = arquivos
            .filter(f => {
                const path = f.path || "";
                const nome = path.split('/').pop();
                return nome.startsWith('final_') && nome.endsWith('.mp4');
            })
            .sort((a, b) => new Date(a.uploaded || 0) - new Date(b.uploaded || 0));
        
        // Mapa de thumbnails disponíveis
        const thumbsDisponiveis = new Set();
        arquivos.forEach(f => {
            const filename = (f.path || "").split('/').pop();
            if (filename.startsWith('thumb_') && filename.endsWith('.jpg')) {
                thumbsDisponiveis.add(f.path);
            }
        });
        
        const novosPaths = finais.map(f => f.path);
        
        if (JSON.stringify(novosPaths) === JSON.stringify(listaCronologica)) return;
        
        for (const [path, card] of videosMap.entries()) {
            if (!novosPaths.includes(path)) {
                card.remove();
                videosMap.delete(path);
            }
        }
        
        for (const file of finais) {
            if (!videosMap.has(file.path)) {
                adicionarCard(file, thumbsDisponiveis);
            }
        }
        
        listaCronologica = novosPaths;

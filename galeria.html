<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PHOTO MOVIE - GALERIA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #001a1a; color: white; font-family: Arial, sans-serif; }
        
        .header {
            background: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #c5a059;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { color: #c5a059; font-size: 24px; }
        
        .evento-nome {
            text-align: center;
            padding: 10px;
            background: #002222;
            color: #c5a059;
            font-size: 14px;
        }
        
        .search {
            padding: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
            background: #000;
        }
        .search input {
            padding: 12px;
            width: 150px;
            border: 1px solid #c5a059;
            background: #000;
            color: #c5a059;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }
        .search button {
            padding: 12px 20px;
            background: #c5a059;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
            padding-bottom: 100px;
        }
        
        .video-card {
            background: #000;
            border: 2px solid #c5a05930;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            cursor: pointer;
        }
        
        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-number {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            color: #c5a059;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal video {
            width: 90%;
            max-height: 70vh;
            border: 3px solid #c5a059;
            border-radius: 15px;
        }
        
        .modal-buttons {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        
        .modal-buttons button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-fechar { background: #333; color: white; }
        .btn-baixar { background: #c5a059; color: black; }
        
        .empty {
            text-align: center;
            padding: 50px;
            color: #666;
            grid-column: 1/-1;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            text-align: center;
            background: #000;
            border-top: 1px solid #c5a059;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>PHOTO MOVIE</h1>
</div>
<div class="evento-nome" id="evento-nome">CARREGANDO...</div>
<div class="search">
    <input type="number" id="busca" placeholder="Nº VÍDEO">
    <button onclick="buscarVideo()">🔍 BUSCAR</button>
</div>

<div class="gallery" id="gallery">
    <div class="empty">📹 Nenhum vídeo encontrado</div>
</div>

<div class="footer">
    <div style="color:#c5a059;">📸 PHOTO MOVIE 360º</div>
</div>

<div class="modal" id="modal">
    <video id="modal-video" controls playsinline></video>
    <div class="modal-buttons">
        <button class="btn-fechar" onclick="fecharModal()">FECHAR</button>
        <button class="btn-baixar" id="btn-baixar">📥 BAIXAR</button>
    </div>
</div>

<script>
const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
let videos = [];
let eventoAtual = "";

async function carregar() {
    // Pega evento da URL ou localStorage
    const params = new URLSearchParams(location.search);
    let evento = params.get('evento');
    
    if (!evento) {
        const config = localStorage.getItem('config_atual');
        if (config) {
            evento = JSON.parse(config).nome;
        }
    }
    
    if (!evento) {
        const res = await fetch(`${WORKER_URL}/listar-eventos`);
        const eventos = await res.json();
        if (eventos.length > 0) {
            evento = eventos[0].nome;
        }
    }
    
    if (!evento) {
        document.getElementById('evento-nome').innerHTML = "⚠️ NENHUM EVENTO";
        return;
    }
    
    eventoAtual = evento;
    document.getElementById('evento-nome').innerHTML = evento.replace(/_/g, ' ');
    
    // Carregar vídeos
    const res = await fetch(`${WORKER_URL}/listar-galeria?evento=${evento}&t=${Date.now()}`);
    const arquivos = await res.json();
    
    // Filtrar apenas final_*.mp4
    videos = arquivos.filter(f => {
        const nome = f.path.split('/').pop();
        return nome.startsWith('final_') && nome.endsWith('.mp4');
    });
    
    // Inverter para mostrar mais recente primeiro
    videos.reverse();
    
    renderizar();
}

function renderizar() {
    const gallery = document.getElementById('gallery');
    
    if (videos.length === 0) {
        gallery.innerHTML = '<div class="empty">📹 Nenhum vídeo encontrado</div>';
        return;
    }
    
    gallery.innerHTML = '';
    
    videos.forEach((video, index) => {
        const num = videos.length - index;
        const url = `${WORKER_URL}/stream?id=${video.path}`;
        
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
            <video src="${url}" muted playsinline preload="metadata"></video>
            <div class="video-number">#${num}</div>
        `;
        
        // Clicar abre o vídeo
        card.onclick = () => abrirVideo(url, video.path);
        
        gallery.appendChild(card);
    });
}

function abrirVideo(url, path) {
    const modal = document.getElementById('modal');
    const video = document.getElementById('modal-video');
    
    video.pause();
    video.src = url;
    modal.style.display = 'flex';
    video.load();
    
    // Tenta tocar automaticamente
    setTimeout(() => {
        video.play().catch(() => {
            // Se bloquear, mostra os controles
            video.controls = true;
        });
    }, 100);
    
    document.getElementById('btn-baixar').onclick = () => {
        const a = document.createElement('a');
        a.href = url;
        a.download = path.split('/').pop();
        a.click();
    };
}

function fecharModal() {
    const modal = document.getElementById('modal');
    const video = document.getElementById('modal-video');
    modal.style.display = 'none';
    video.pause();
    video.src = "";
}

function buscarVideo() {
    const num = parseInt(document.getElementById('busca').value);
    if (isNaN(num)) {
        alert("Digite um número válido");
        return;
    }
    
    const index = videos.length - num;
    if (videos[index]) {
        const url = `${WORKER_URL}/stream?id=${videos[index].path}`;
        abrirVideo(url, videos[index].path);
    } else {
        alert(`Vídeo #${num} não encontrado. Total: ${videos.length}`);
    }
}

// Iniciar
carregar();
setInterval(carregar, 10000);
</script>
</body>
</html>

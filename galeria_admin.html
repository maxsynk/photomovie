<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHOTO MOVIE - ADMIN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root { --turquesa: #00d1d1; --dourado: #c5a059; --bg: #001a1a; --danger: #ff4d4d; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; min-height: 100vh; }
        
        .sticky-top { position: sticky; top: 0; z-index: 100; background: var(--bg); }
        .header { padding: 20px; border-bottom: 2px solid var(--dourado); background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); }
        .header h1 { color: var(--dourado); letter-spacing: 5px; margin: 0; text-transform: uppercase; font-size: 1.8rem; font-weight: 900; }
        .subtitle { font-size: 11px; letter-spacing: 4px; opacity: 0.9; margin-top: 2px; text-transform: uppercase; color: var(--dourado); }
        .admin-label { font-size: 14px; color: var(--dourado); letter-spacing: 2px; margin-top: 5px; font-weight: bold; }

        .event-info-container { display: flex; align-items: center; justify-content: flex-start; width: 100%; margin-top: 15px; padding-left: 10px; cursor: pointer; }
        .v-line { width: 2px; height: 30px; background: var(--dourado); border-radius: 2px; margin-right: 10px; }
        #nome-evento-titulo { color: var(--dourado); font-size: 13px; margin: 0; letter-spacing: 1px; text-transform: uppercase; font-weight: bold; text-align: left; }

        .search-area { padding: 15px; background: rgba(0,0,0,0.9); display: flex; justify-content: center; gap: 10px; border-bottom: 1px solid rgba(197, 160, 89, 0.2); backdrop-filter: blur(10px); }
        .search-area input { width: 180px; padding: 12px; border-radius: 8px; border: 1px solid var(--dourado); background: #000; color: var(--dourado); text-align: center; font-weight: bold; outline: none; font-size: 18px; }
        .btn-busca { background: var(--dourado); color: black; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

        .admin-tools { display: flex; gap: 10px; justify-content: center; padding: 15px; flex-wrap: wrap; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 15px; padding-bottom: 120px; }

        .video-card { background: #000; border: 1px solid rgba(197, 160, 89, 0.3); border-radius: 12px; overflow: hidden; aspect-ratio: 9/16; position: relative; cursor: pointer; }
        .video-card:hover { border-color: var(--dourado); }
        .video-card video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .video-id-badge { position: absolute; top: 8px; left: 8px; background: var(--dourado); color: black; padding: 2px 8px; border-radius: 4px; font-weight: 900; font-size: 12px; z-index: 10; }
        .btn-del-mini { position: absolute; top: 8px; right: 8px; background: var(--danger); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; z-index: 20; font-size: 16px; }
        .btn-del-mini:hover { background: #ff0000; transform: scale(1.05); }

        #modal-zoom { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #media-full { width: 90%; max-height: 70vh; border: 2px solid var(--dourado); border-radius: 15px; background: #000; }
        .modal-controls { margin-top: 25px; display: flex; gap: 15px; width: 90%; justify-content: center; flex-wrap: wrap; }
        .btn-action { padding: 12px 25px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; text-transform: uppercase; }
        .btn-close { background: #333; color: white; }
        .btn-download { background: var(--dourado); color: black; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-zip { background: #28a745; color: white; }
        .nav-footer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 500; width: 90%; }
        
        .empty-gallery { text-align: center; padding: 50px; color: #666; grid-column: 1/-1; }
        .empty-gallery p { font-size: 16px; margin-top: 20px; }
        .loading { text-align: center; padding: 50px; color: var(--dourado); grid-column: 1/-1; }
    </style>
</head>
<body>

    <div class="sticky-top">
        <div class="header">
            <h1>PHOTO MOVIE</h1>
            <p class="subtitle">COLECIONANDO MOMENTOS</p>
            <div class="admin-label">👑 GALERIA ADMIN</div>
            <div class="event-info-container" onclick="copiarLinkAdmin()">
                <div class="v-line"></div>
                <p id="nome-evento-titulo">CARREGANDO...</p>
            </div>
        </div>

        <div class="search-area">
            <input type="number" id="input-busca" placeholder="Nº VÍDEO">
            <button class="btn-busca" onclick="executarBusca()">🔍 PESQUISAR</button>
        </div>
    </div>

    <div class="admin-tools">
        <button class="btn-action btn-zip" onclick="baixarTudoZip()">📦 BAIXAR TODOS (ZIP)</button>
        <button class="btn-action btn-danger" onclick="excluirTudo()">⚠️ APAGAR GALERIA</button>
    </div>

    <div id="gallery-container" class="gallery-grid">
        <div class="loading">
            <p>⏳ CARREGANDO VÍDEOS...</p>
        </div>
    </div>

    <div class="nav-footer">
        <a href="index.html" class="btn-action btn-close" style="display: block; text-align: center; background: rgba(197, 160, 89, 0.1); color: var(--dourado); border: 1px solid var(--dourado);">← VOLTAR</a>
    </div>

    <div id="modal-zoom">
        <video id="media-full" controls playsinline webkit-playsinline crossorigin="anonymous" preload="metadata"></video>
        <div class="modal-controls">
            <button class="btn-action btn-close" onclick="fecharZoom()">FECHAR</button>
            <button id="btn-download-force" class="btn-action btn-download">📥 BAIXAR MP4</button>
            <button id="btn-delete-modal" class="btn-action btn-danger">🗑️ EXCLUIR VÍDEO</button>
        </div>
    </div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
    let listaFinais = [];
    let idPastaFixo = ""; 
    let carregando = false;

    function copiarLinkAdmin() {
        if(!idPastaFixo) { alert("Aguardando carregamento do evento..."); return; }
        const link = `${window.location.origin}${window.location.pathname}?evento=${encodeURIComponent(idPastaFixo)}`;
        navigator.clipboard.writeText(link).then(() => {
            alert("✅ Link da Galeria Admin Copiado!\n" + link);
        }).catch(() => { alert("Link: " + link); });
    }

    window.onload = () => { carregarEvento(); };

    async function carregarEvento() {
        const urlParams = new URLSearchParams(window.location.search);
        let eventoEncontrado = urlParams.get('evento');
        
        if(!eventoEncontrado) {
            const config = JSON.parse(localStorage.getItem('config_atual'));
            if(config) {
                // CORREÇÃO MESTRE: Prioriza o ID numérico do evento!
                eventoEncontrado = config.id || config.nome || config.id_fixo;
                document.getElementById('nome-evento-titulo').innerText = (config.nome || "Evento").replace(/_/g, ' ');
            }
        }
        
        if(!eventoEncontrado) {
            try {
                const res = await fetch(`${WORKER_URL}/listar-eventos?t=${Date.now()}`);
                const eventos = await res.json();
                if(eventos && eventos.length > 0) {
                    eventoEncontrado = eventos[0].id; // Pega o ID, não o nome
                    document.getElementById('nome-evento-titulo').innerText = eventos[0].nome.replace(/_/g, ' ');
                }
            } catch(e) { console.log("Erro ao buscar eventos:", e); }
        }

        if(!eventoEncontrado) {
            document.getElementById('nome-evento-titulo').innerHTML = "⚠️ NENHUM EVENTO";
            document.getElementById('gallery-container').innerHTML = '<div class="empty-gallery"><p>❌ Nenhum evento encontrado</p><small>Crie um evento no menu principal</small></div>';
            return;
        }
        
        idPastaFixo = String(eventoEncontrado); // Garante que é string
        document.getElementById('nome-evento-titulo').innerHTML = "ID: " + idPastaFixo;
        carregarArquivos();
        setInterval(carregarArquivos, 5000);
    }

    async function carregarArquivos() {
        if(carregando) return;
        carregando = true;
        try {
            const url = `${WORKER_URL}/listar-galeria?evento=${encodeURIComponent(idPastaFixo)}&t=${Date.now()}`;
            const res = await fetch(url);
            const dados = await res.json();
            
            const novosFinais = dados.filter(f => {
                const path = f.path || "";
                const filename = path.split('/').pop();
                return filename.startsWith('final_') && filename.endsWith('.mp4');
            });
            
            if (JSON.stringify(novosFinais) !== JSON.stringify(listaFinais)) {
                listaFinais = novosFinais;
                renderizarGaleria();
            }
        } catch (e) { 
            console.error("Erro ao carregar arquivos:", e);
            document.getElementById('gallery-container').innerHTML = '<div class="empty-gallery"><p>⚠️ Erro ao conectar com o servidor</p><small>Verifique sua conexão</small></div>';
        } finally { carregando = false; }
    }

    function renderizarGaleria() {
        const container = document.getElementById('gallery-container');
        if (!listaFinais || listaFinais.length === 0) {
            container.innerHTML = '<div class="empty-gallery"><p>📹 Nenhum vídeo encontrado</p><small>Grave um vídeo na câmera para aparecer aqui</small></div>';
            return;
        }
        container.innerHTML = "";
        listaFinais.forEach((file, index) => {
            const url = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
            const numeroVideo = index + 1;
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="video-id-badge">#${numeroVideo}</div>
                <button class="btn-del-mini" onclick="event.stopPropagation(); excluirArquivo('${file.path}')">✕</button>
                <video muted playsinline webkit-playsinline preload="metadata"></video>
            `;
            const videoElement = card.querySelector('video');
            videoElement.src = url;
            videoElement.load();
            card.onclick = () => abrirZoom(url, file.path);
            container.appendChild(card);
        });
    }

    function executarBusca() {
        const num = document.getElementById('input-busca').value;
        if (!num) { alert("Digite um número de vídeo"); return; }
        const index = parseInt(num) - 1;
        if (listaFinais[index]) {
            const file = listaFinais[index];
            const url = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
            abrirZoom(url, file.path);
            document.getElementById('input-busca').value = '';
        } else { alert(`❌ Vídeo #${num} não encontrado!\nTotal de vídeos: ${listaFinais.length}`); }
    }

    function abrirZoom(url, path) {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        video.pause(); video.src = "";
        modal.style.display = 'flex';
        video.src = url;
        video.load();
        const playPromise = video.play();
        if (playPromise !== undefined) { playPromise.catch(error => { video.controls = true; }); }
        document.getElementById('btn-download-force').onclick = () => forcarDownload(url, path.split('/').pop());
        document.getElementById('btn-delete-modal').onclick = () => { excluirArquivo(path); fecharZoom(); };
    }

    async function excluirArquivo(path) {
        if(!confirm("🗑️ Tem certeza que deseja excluir este vídeo permanentemente?")) return;
        try {
            const response = await fetch(`${WORKER_URL}/deletar`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: path }) 
            });
            if(response.ok) { alert("✅ Vídeo excluído!"); carregarArquivos(); } 
            else { alert("❌ Erro ao excluir vídeo"); }
        } catch(e) { alert("❌ Erro de conexão ao excluir"); }
    }

    async function excluirTudo() {
        if(prompt("⚠️ Digite 'APAGAR TUDO' para confirmar a exclusão de TODOS os vídeos:") !== 'APAGAR TUDO') { return; }
        let excluidos = 0;
        for(let f of listaFinais) {
            try {
                await fetch(`${WORKER_URL}/deletar`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: f.path }) });
                excluidos++;
            } catch(e) { console.error("Erro ao excluir:", f.path); }
        }
        alert(`✅ ${excluidos} vídeo(s) excluído(s)!`);
        carregarArquivos();
    }

    async function baixarTudoZip() {
        if(listaFinais.length === 0) { alert("Nenhum vídeo para baixar"); return; }
        const btn = document.querySelector('.btn-zip');
        const originalText = btn.innerText;
        btn.innerText = "⏳ EMPACOTANDO...";
        btn.disabled = true;
        try {
            const zip = new JSZip();
            for(let i = 0; i < listaFinais.length; i++) {
                const res = await fetch(`${WORKER_URL}/stream?id=${encodeURIComponent(listaFinais[i].path)}`);
                const blob = await res.blob();
                zip.file(`video_${i+1}.mp4`, blob);
                btn.innerText = `📦 ${i+1}/${listaFinais.length}`;
            }
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `Galeria_Admin_${idPastaFixo}.zip`);
            alert(`✅ ZIP criado com ${listaFinais.length} vídeo(s)!`);
        } catch(e) { alert("❌ Erro ao criar ZIP: " + e.message); } 
        finally { btn.innerText = originalText; btn.disabled = false; }
    }

    async function forcarDownload(url, filename) {
        try { const res = await fetch(url); const blob = await res.blob(); saveAs(blob, filename); } 
        catch(e) { alert("❌ Erro ao baixar: " + e.message); }
    }

    function fecharZoom() {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        modal.style.display = 'none';
        video.pause();
        video.src = "";
    }
</script>
</body>
</html>

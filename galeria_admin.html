<!--
PHOTO MOVIE - Galeria Admin
VERSÃO: 2.0.3
ÚLTIMA ATUALIZAÇÃO: 22/08/2026

CHANGELOG v2.0.3:
- ADICIONADO: Volta direto para câmera após sair da galeria
- CORRIGIDO: Navegação inteligente entre câmera e galeria
- MELHORADO: Fluxo de retorno otimizado para operador
-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PHOTO MOVIE - ADMIN v2.0.3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Movie">
<!-- ▼▼▼ [INÍCIO] TRAVA DE ACESSO ▼▼▼ -->
<script>
if (sessionStorage.getItem('logado') !== 'true') {
    document.documentElement.style.display = 'none';
    location.replace('index.html');
}
</script>
<!-- ▲▲▲ [FIM] TRAVA DE ACESSO ▲▲▲ -->
<link rel="stylesheet" href="app.css">
<script src="pwa.js" defer></script>
</head>
<body class="pg-admin">

    <div class="sticky-top">
        <div class="header">
            <h1>PHOTO MOVIE</h1>
            <p class="subtitle">COLECIONANDO MOMENTOS</p>
            <div class="admin-label">👑 GALERIA ADMIN v2.0.3</div>
            <div class="event-info-container" onclick="copiarLinkAdmin()">
                <div class="v-line"></div>
                <p id="nome-evento-titulo">CARREGANDO...</p>
            </div>
        </div>

        <div class="search-area">
            <input type="number" id="input-busca" placeholder="Nº VÍDEO">
            <button class="btn-busca" onclick="executarBusca()">🔍 PESQUISAR</button>
        </div>
    </div>

    <div class="admin-tools">
        <button class="btn-action btn-zip" onclick="baixarTudoZip()">📦 BAIXAR TODOS (ZIP)</button>
        <button class="btn-action btn-zip" onclick="copiarLinkCliente()">🔗 LINK DO CLIENTE</button>
        <button class="btn-action btn-danger" onclick="excluirTudo()">⚠️ APAGAR GALERIA</button>
    </div>

    <div class="stats-bar" id="stats-bar"></div>

    <div id="gallery-container" class="gallery-grid">
        <div class="loading">
            <p>⏳ CARREGANDO VÍDEOS...</p>
        </div>
    </div>

    <div class="nav-footer">
        <a href="#" id="btn-voltar" class="btn-action btn-close">← VOLTAR</a>
    </div>

    <div id="modal-zoom">
        <video id="media-full" controls playsinline webkit-playsinline crossorigin="anonymous" preload="metadata"></video>
        <div class="modal-controls">
            <button class="btn-action btn-close" onclick="fecharZoom()">FECHAR</button>
            <button id="btn-download-force" class="btn-action btn-download">📥 BAIXAR MP4</button>
            <button id="btn-delete-modal" class="btn-action btn-danger">🗑️ EXCLUIR VÍDEO</button>
        </div>
    </div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
    let idPastaFixo = "";
    let carregando = false;
    
    const videosMap = new Map();
    let listaCronologica = [];

    // Função para voltar (inteligente)
    function voltarParaOrigem() {
        const voltarParaCamera = localStorage.getItem('voltar_para_camera');
        if (voltarParaCamera === 'true') {
            localStorage.removeItem('voltar_para_camera');
            window.location.href = 'camera.html';
        } else {
            window.location.href = 'index.html';
        }
    }

    function copiarLinkAdmin() {
        if(!idPastaFixo) { alert("Aguardando carregamento do evento..."); return; }
        const link = `${window.location.origin}${window.location.pathname}?evento=${encodeURIComponent(idPastaFixo)}`;
        navigator.clipboard.writeText(link).then(() => {
            alert("✅ Link da Galeria Admin Copiado!\n" + link);
        }).catch(() => { alert("Link: " + link); });
    }

    window.onload = () => { 
        carregarEvento();
        
        // Configurar botão voltar
        document.getElementById('btn-voltar').addEventListener('click', function(e) {
            e.preventDefault();
            voltarParaOrigem();
        });
    };

    async function carregarEvento() {
        const urlParams = new URLSearchParams(window.location.search);
        let eventoEncontrado = urlParams.get('evento');
        
        if(!eventoEncontrado) {
            const config = JSON.parse(localStorage.getItem('config_atual'));
            if(config) {
                eventoEncontrado = config.id || config.nome || config.id_fixo;
                document.getElementById('nome-evento-titulo').innerText = (config.nome || "Evento").replace(/_/g, ' ');
            }
        }
        
        if(!eventoEncontrado) {
            try {
                const res = await fetch(`${WORKER_URL}/listar-eventos?t=${Date.now()}`);
                const eventos = await res.json();
                if(eventos && eventos.length > 0) {
                    eventoEncontrado = eventos[0].id;
                    document.getElementById('nome-evento-titulo').innerText = eventos[0].nome.replace(/_/g, ' ');
                }
            } catch(e) { console.log("Erro ao buscar eventos:", e); }
        }

        if(!eventoEncontrado) {
            document.getElementById('nome-evento-titulo').innerHTML = "⚠️ NENHUM EVENTO";
            document.getElementById('gallery-container').innerHTML = '<div class="empty-gallery"><p>❌ Nenhum evento encontrado</p><small>Crie um evento no menu principal</small></div>';
            return;
        }
        
        idPastaFixo = String(eventoEncontrado);
        { const tt = document.getElementById('nome-evento-titulo'); if (!tt.textContent || tt.textContent === 'CARREGANDO...') tt.textContent = 'EVENTO: ' + idPastaFixo.replace(/_/g, ' '); }
        
        videosMap.clear();
        listaCronologica = [];
        document.getElementById('gallery-container').innerHTML = '';
        
        await atualizarGaleriaIncremental();
        setInterval(atualizarGaleriaIncremental, 5000);
    }

    async function atualizarGaleriaIncremental() {
        if(carregando) return;
        const modal = document.getElementById('modal-zoom');
        if (modal.style.display === 'flex') return;
        
        carregando = true;
        try {
            const url = `${WORKER_URL}/listar-galeria?evento=${encodeURIComponent(idPastaFixo)}&t=${Date.now()}`;
            const res = await fetch(url);
            const dados = await res.json();
            
            // Filtra apenas vídeos finais (não thumbnails)
            const finais = dados
                .filter(f => {
                    const path = f.path || "";
                    const filename = path.split('/').pop();
                    return filename.startsWith('final_') && filename.endsWith('.mp4');
                })
                .sort((a, b) => new Date(a.uploaded || 0) - new Date(b.uploaded || 0));
            
            // Cria um mapa de thumbnails disponíveis
            const thumbsDisponiveis = new Set();
            dados.forEach(f => {
                const filename = (f.path || "").split('/').pop();
                if (filename.startsWith('thumb_') && filename.endsWith('.jpg')) {
                    thumbsDisponiveis.add(f.path);
                }
            });
            
            atualizarStats(dados, finais);
            const novosPaths = finais.map(f => f.path);
            
            if (JSON.stringify(novosPaths) === JSON.stringify(listaCronologica)) {
                return;
            }
            
            // Remove vídeos excluídos
            for (const [path, card] of videosMap.entries()) {
                if (!novosPaths.includes(path)) {
                    card.remove();
                    videosMap.delete(path);
                }
            }
            
            // Adiciona novos vídeos
            for (const file of finais) {
                if (!videosMap.has(file.path)) {
                    adicionarCard(file, thumbsDisponiveis);
                }
            }
            
            listaCronologica = novosPaths;
            reordenarCards();
            renumerarCards();
            
        } catch (e) {
            console.error("Erro ao atualizar galeria:", e);
        } finally {
            carregando = false;
        }
    }

    function getThumbPath(videoPath) {
        // Converte: evento/final_vid_123.mp4 -> evento/thumb_vid_123.jpg
        const partes = videoPath.split('/');
        const filename = partes.pop();
        const baseName = filename.replace('final_', '').replace('.mp4', '');
        return `${partes.join('/')}/thumb_${baseName}.jpg`;
    }

    function adicionarCard(file, thumbsDisponiveis) {
        const container = document.getElementById('gallery-container');
        const videoUrl = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
        const thumbPath = getThumbPath(file.path);
        const thumbUrl = `${WORKER_URL}/stream?id=${encodeURIComponent(thumbPath)}`;
        
        const card = document.createElement('div');
        card.className = 'video-card';
        card.dataset.path = file.path;
        
        // Usa thumbnail como capa, com fallback para vídeo
        card.innerHTML = `
            <div class="video-id-badge">#?</div>
            <button class="btn-del-mini" onclick="event.stopPropagation(); excluirArquivo('${file.path}')">✕</button>
            <img class="thumb-img" src="${thumbUrl}" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                 onload="this.style.display='block';"
                 alt="Capa do vídeo" 
                 loading="lazy">
            <video muted playsinline webkit-playsinline preload="none" loop 
                   style="background: #000; display: none; width: 100%; height: 100%; object-fit: cover;"></video>
            <div class="play-icon"></div>
        `;
        
        // Fallback: se thumbnail falhar, carrega o vídeo
        const videoEl = card.querySelector('video');
        videoEl.src = videoUrl;
        
        card.onclick = () => abrirZoom(videoUrl, file.path);
        container.appendChild(card);
        
        videosMap.set(file.path, card);
    }

    function reordenarCards() {
        const container = document.getElementById('gallery-container');
        for (const card of videosMap.values()) {
            card.remove();
        }
        for (let i = listaCronologica.length - 1; i >= 0; i--) {
            const path = listaCronologica[i];
            const card = videosMap.get(path);
            if (card) {
                container.appendChild(card);
            }
        }
    }

    function renumerarCards() {
        listaCronologica.forEach((path, index) => {
            const card = videosMap.get(path);
            if (card) {
                const badge = card.querySelector('.video-id-badge');
                if (badge) badge.textContent = `#${index + 1}`;
            }
        });
    }

    function executarBusca() {
        const num = document.getElementById('input-busca').value;
        if (!num) { alert("Digite um número de vídeo"); return; }
        const index = parseInt(num) - 1;
        if (listaCronologica[index]) {
            const path = listaCronologica[index];
            const url = `${WORKER_URL}/stream?id=${encodeURIComponent(path)}`;
            abrirZoom(url, path);
            document.getElementById('input-busca').value = '';
        } else { 
            alert(`❌ Vídeo #${num} não encontrado!\nTotal de vídeos: ${listaCronologica.length}`); 
        }
    }

    function abrirZoom(url, path) {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        video.pause();
        video.src = "";
        
        modal.style.display = 'flex';
        
        video.src = url;
        video.load();
        const pp = video.play();
        if (pp !== undefined) pp.catch(() => { video.controls = true; });
        
        document.getElementById('btn-download-force').onclick = () => forcarDownload(url, path.split('/').pop());
        document.getElementById('btn-delete-modal').onclick = () => { excluirArquivo(path); fecharZoom(); };
    }

    function caminhosRelacionados(path) {
        const partes = path.split('/'); const f = partes.pop(); const dir = partes.join('/');
        const base = f.replace(/^final_/, '').replace(/\.mp4$/, '');
        return [path, dir + '/thumb_' + base + '.jpg', dir + '/' + base + '.mp4', dir + '/' + base + '.webm'];
    }
    async function deletarLote(paths) {
        const r = await fetch(WORKER_URL + '/deletar-lote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paths }) });
        if (!r.ok) throw new Error('HTTP ' + r.status);
    }
    async function excluirArquivo(path) {
        if (!confirm("🗑️ Excluir este vídeo permanentemente (inclui capa e arquivo original)?")) return;
        try {
            await deletarLote(caminhosRelacionados(path));
            alert("✅ Vídeo excluído!");
            const card = videosMap.get(path);
            if (card) { card.remove(); videosMap.delete(path); listaCronologica = listaCronologica.filter(p => p !== path); reordenarCards(); renumerarCards(); }
        } catch (e) { alert("❌ Não foi possível excluir. Entre de novo na Central e tente outra vez."); }
    }
    async function excluirTudo() {
        if (prompt("⚠️ Digite 'APAGAR TUDO' para apagar TODOS os vídeos desta galeria:") !== 'APAGAR TUDO') return;
        try {
            const todos = listaCronologica.flatMap(caminhosRelacionados);
            for (let i = 0; i < todos.length; i += 500) await deletarLote(todos.slice(i, i + 500));
            alert(`✅ ${listaCronologica.length} vídeo(s) excluído(s)!`);
            videosMap.clear(); listaCronologica = [];
            document.getElementById('gallery-container').innerHTML = '<div class="empty-gallery"><p>📹 Nenhum vídeo encontrado</p></div>';
        } catch (e) { alert("❌ Falha ao apagar. Entre de novo na Central e tente outra vez."); }
    }
    function copiarLinkCliente() {
        if (!idPastaFixo) { alert("Aguarde o carregamento do evento."); return; }
        const link = 'https://maxsynk.github.io/photomovie/galeria.html?evento=' + encodeURIComponent(idPastaFixo);
        navigator.clipboard.writeText(link).then(() => alert("Link do cliente copiado!")).catch(() => alert(link));
    }
    function atualizarStats(dados, finais) {
        const nomes = new Set(dados.map(f => f.path.split('/').pop()));
        const proc = dados.map(f => f.path.split('/').pop()).filter(n => /^vid_.*\.(mp4|webm)$/.test(n) && !nomes.has('final_' + n.replace(/\.(mp4|webm)$/, '') + '.mp4')).length;
        const mb = finais.reduce((s, f) => s + (f.size || 0), 0) / 1048576;
        document.getElementById('stats-bar').innerHTML = '<span><b>' + finais.length + '</b> prontos</span><span class="' + (proc ? 'proc' : '') + '"><b>' + proc + '</b> processando</span><span><b>' + mb.toFixed(0) + '</b> MB</span>';
    }

    async function baixarTudoZip() {
        if(listaCronologica.length === 0) { alert("Nenhum vídeo para baixar"); return; }
        const btn = document.querySelector('.btn-zip');
        const originalText = btn.innerText;
        btn.innerText = "⏳ EMPACOTANDO...";
        btn.disabled = true;
        try {
            const zip = new JSZip();
            for(let i = 0; i < listaCronologica.length; i++) {
                const res = await fetch(`${WORKER_URL}/stream?id=${encodeURIComponent(listaCronologica[i])}`);
                const blob = await res.blob();
                zip.file(`video_${String(i+1).padStart(3,'0')}.mp4`, blob);
                btn.innerText = `📦 ${i+1}/${listaCronologica.length}`;
            }
            const content = await zip.generateAsync({type:"blob", compression:"STORE", streamFiles:true});
            saveAs(content, `Galeria_Admin_${idPastaFixo}.zip`);
            alert(`✅ ZIP criado com ${listaCronologica.length} vídeo(s)!`);
        } catch(e) { alert("❌ Erro ao criar ZIP: " + e.message); } 
        finally { btn.innerText = originalText; btn.disabled = false; }
    }

    async function forcarDownload(url, filename) {
        try { const res = await fetch(url); const blob = await res.blob(); saveAs(blob, filename); } 
        catch(e) { alert("❌ Erro ao baixar: " + e.message); }
    }

    function fecharZoom() {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        modal.style.display = 'none';
        video.pause();
        video.src = "";
    }
</script>
</body>
</html>

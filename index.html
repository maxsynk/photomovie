<body class="pg-home">

<!-- ▼▼▼ [INÍCIO] CABEÇALHO ▼▼▼ -->
<header class="header"><h1>PHOTO MOVIE</h1><p>colecionando momentos</p><button id="btn-lock" class="link" hidden>Sair</button></header>
<!-- ▲▲▲ [FIM] CABEÇALHO ▲▲▲ -->

<main class="wrap">

  <!-- ▼▼▼ [INÍCIO] TELA DE LOGIN ▼▼▼ -->
  <section id="view-login">
    <div class="lock-badge" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
    </div>
    <h2>Central do operador</h2>
    <p>Entre com a senha mestra para gerenciar eventos.</p>
    <input type="password" id="input-senha" autocomplete="current-password" placeholder="Senha">
    <button class="pbtn y" id="btn-entrar">Entrar</button>
  </section>
  <!-- ▲▲▲ [FIM] TELA DE LOGIN ▲▲▲ -->

  <!-- ▼▼▼ [INÍCIO] TELA PRINCIPAL (EVENTOS) ▼▼▼ -->
  <section id="view-home" hidden>
    <div id="hero"></div>
    <div class="divider-line"><span>Eventos gravados</span></div>
    <div class="sec-title"><span>Eventos</span><small id="cont"></small></div>
    <ul id="lista-eventos"></ul>
  </section>
  <!-- ▲▲▲ [FIM] TELA PRINCIPAL (EVENTOS) ▲▲▲ -->

</main>

<!-- ▼▼▼ [INÍCIO] BARRA INFERIOR (começa oculta; só aparece após o login) ▼▼▼ -->
<nav id="tabbar" hidden>
  <a href="index.html" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Eventos</a>
  <a href="config_evento.html" class="new" id="tab-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo evento</a>
  <a href="galeria_admin.html"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 9"/></svg>Galeria</a>
</nav>
<!-- ▲▲▲ [FIM] BARRA INFERIOR ▲▲▲ -->

<script>
const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
const CLIENTE_URL = "https://maxsynk.github.io/photomovie/galeria.html";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let EVENTOS = [];
const ativo = () => { try { return JSON.parse(localStorage.getItem('config_atual')); } catch (e) { return null; } };
const fmtData = d => /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d.split('-').reverse().join('/') : (d || 'sem data');
const nomeEv = ev => esc((ev.nome || 'Evento sem nome').replace(/_/g, ' '));

window.onload = () => {
  $('btn-entrar').onclick = entrar;
  $('input-senha').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  $('input-senha').addEventListener('input', () => $('input-senha').classList.remove('erro'));
  $('btn-lock').onclick = sair;
  $('hero').onclick = acaoHero;
  $('lista-eventos').onclick = acaoLista;
  $('tab-new').onclick = () => localStorage.removeItem('evento_para_editar');
  if (sessionStorage.getItem('logado') === 'true') liberar();
};

async function entrar() {
  const senha = $('input-senha').value;
  const btn = $('btn-entrar');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    const r = await fetch(WORKER_URL + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha }) });
    const d = await r.json();
    if (d.ok) { sessionStorage.setItem('logado', 'true'); if (d.token) sessionStorage.setItem('pm_token', d.token); liberar(); }
    else { const i = $('input-senha'); i.classList.remove('erro'); void i.offsetWidth; i.classList.add('erro'); i.select(); }
  } catch (e) { alert('Sem conexão com o servidor'); }
  finally { btn.disabled = false; }
}
function liberar() {
  $('view-login').hidden = true; $('view-home').hidden = false; $('btn-lock').hidden = false;
  $('tabbar').hidden = false; carregar();
}
function sair() { sessionStorage.removeItem('logado'); sessionStorage.removeItem('pm_token'); location.reload(); }

async function carregar() {
  try {
    const r = await fetch(WORKER_URL + '/listar-eventos?t=' + Date.now());
    EVENTOS = await r.json(); if (!Array.isArray(EVENTOS)) EVENTOS = [];
  } catch (e) { $('lista-eventos').innerHTML = '<li class="empty">Sem conexão com o servidor. Verifique a internet e abra de novo.</li>'; return; }
  desenhar();
}
function desenhar() {
  const a = ativo(), atual = a && EVENTOS.find(e => e.id === a.id);
  $('hero').innerHTML = atual
    ? '<span class="live">Evento ativo</span><h2>' + nomeEv(atual) + '</h2><p class="meta">' + fmtData(atual.data) + ' · ' + esc(atual.tempo || 10) + 's por vídeo</p>'
      + '<button class="go" data-a="gravar">Gravar</button><div class="quick"><button class="pbtn" data-a="telao">Telão</button><button class="pbtn" data-a="galeria">Galeria</button><button class="pbtn" data-a="link">Link do cliente</button></div>'
    : '<p class="hero-empty">Nenhum evento ativo. Toque em Ativar em um evento da lista para começar a gravar.</p>';
  $('cont').textContent = EVENTOS.length + (EVENTOS.length === 1 ? ' evento' : ' eventos');
  $('lista-eventos').innerHTML = EVENTOS.length ? EVENTOS.map((ev, i) => {
    const on = atual && atual.id === ev.id;
    return '<li class="ev' + (on ? ' on' : '') + '" data-i="' + i + '"><strong>' + nomeEv(ev) + '</strong><span>' + fmtData(ev.data) + ' · ' + esc(ev.tempo || 10) + 's por vídeo</span>'
      + '<div class="acts"><button class="pbtn' + (on ? ' y' : '') + '" data-a="ativar">' + (on ? 'Ativo' : 'Ativar') + '</button><button class="pbtn" data-a="editar">Editar</button><button class="pbtn red" data-a="excluir">Excluir</button></div></li>';
  }).join('') : '<li class="empty">Nenhum evento ainda. Toque em + Novo evento.</li>';
}
function acaoHero(e) {
  const b = e.target.closest('button'); if (!b) return; const a = ativo(); if (!a) return;
  if (b.dataset.a === 'gravar') location.href = 'camera.html';
  if (b.dataset.a === 'galeria') location.href = 'galeria_admin.html';
  if (b.dataset.a === 'telao') window.open(WORKER_URL + '/telao?evento=' + encodeURIComponent(a.id), '_blank');
  if (b.dataset.a === 'link') navigator.clipboard.writeText(CLIENTE_URL + '?evento=' + encodeURIComponent(a.id)).then(() => alert('Link do cliente copiado!'));
}
async function acaoLista(e) {
  const b = e.target.closest('button'), li = e.target.closest('li[data-i]'); if (!b || !li) return;
  const ev = EVENTOS[+li.dataset.i], a = ativo();
  if (b.dataset.a === 'ativar') {
    if (a && a.id === ev.id) { localStorage.removeItem('config_atual'); alert('Evento desativado'); }
    else { localStorage.setItem('config_atual', JSON.stringify({ id: ev.id, nome: ev.nome, tempo: ev.tempo || '10', molduraUrl: ev.molduraUrl || '', musicaUrl: ev.musicaUrl || '' })); alert('Evento ativado'); }
    desenhar();
  }
  if (b.dataset.a === 'editar') { localStorage.setItem('evento_para_editar', JSON.stringify(ev)); location.href = 'config_evento.html?id=' + encodeURIComponent(ev.id); }
  if (b.dataset.a === 'excluir' && confirm('Apagar o evento "' + (ev.nome || ev.id) + '" e todos os arquivos dele?')) {
    try {
      const r = await fetch(WORKER_URL + '/deletar-evento-completo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: ev.id, evento: ev.id }) });
      if (!r.ok) throw new Error(); if (a && a.id === ev.id) localStorage.removeItem('config_atual'); carregar();
    } catch (err) { alert('Não foi possível excluir. Entre de novo e tente outra vez.'); }
  }
}
</script>
